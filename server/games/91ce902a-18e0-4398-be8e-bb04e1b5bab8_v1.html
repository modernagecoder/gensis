<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Bullet Wave Blitz</title></head><body style="margin:0"><canvas id="gameCanvas"></canvas><script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=600;
const keys={};
window.addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 keys[e.key]=true;keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false;});
canvas.addEventListener('click',()=>window.focus());
let player={x:400,y:500,width:40,height:40,health:3,speed:300};
let bullets=[],enemies=[],powerUps=[],obstacles=[];
let fireCooldown=0,score=0,wave=1,spawnTimer=0,spawnInterval=2,gameStatus='playing';
window.__gameState={player:{},score:0,status:'',entities:[]};
function spawnEnemy(){enemies.push({x:Math.random()*760,y:-20,width:40,height:40,vy:80+wave*10,health:1});}
function spawnPower(){powerUps.push({x:Math.random()*760,y:-20,width:30,height:30,vy:60});}
function spawnObstacle(){obstacles.push({x:Math.random()*760,y:-20,width:60,height:60,vy:40});}
function update(dt){
 if(gameStatus!=='playing')return;
 if(keys['ArrowUp'])player.y-=player.speed*dt;
 if(keys['ArrowDown'])player.y+=player.speed*dt;
 if(keys['ArrowLeft'])player.x-=player.speed*dt;
 if(keys['ArrowRight'])player.x+=player.speed*dt;
 player.x=Math.max(0,Math.min(canvas.width-player.width,player.x));
 player.y=Math.max(0,Math.min(canvas.height-player.height,player.y));
 if(fireCooldown>0)fireCooldown-=dt;
 if(keys[' ']||keys['Space'])fireBullet();
 bullets.forEach(b=>b.y+=b.vy*dt);
 bullets=bullets.filter(b=>b.y>-20);
 enemies.forEach(e=>e.y+=e.vy*dt);
 enemies=enemies.filter(e=>e.y<canvas.height+20);
 powerUps.forEach(p=>p.y+=p.vy*dt);
 powerUps=powerUps.filter(p=>p.y<canvas.height+20);
 obstacles.forEach(o=>o.y+=o.vy*dt);
 obstacles=obstacles.filter(o=>o.y<canvas.height+20);
 bullets.forEach((b,i)=>{enemies.forEach((e,j)=>{if(checkAABB(b,e)){bullets.splice(i,1);enemies.splice(j,1);score+=100;}});});
 enemies.forEach((e,i)=>{if(checkAABB(e,player)){enemies.splice(i,1);player.health--;if(player.health<=0){gameStatus='lost';}}});
 powerUps.forEach((p,i)=>{if(checkAABB(p,player)){powerUps.splice(i,1);score+=200;player.health=Math.min(3,player.health+1);}});
 obstacles.forEach((o,i)=>{if(checkAABB(o,player)){obstacles.splice(i,1);player.health--;if(player.health<=0){gameStatus='lost';}}});
 spawnTimer+=dt;
 if(spawnTimer>=spawnInterval){spawnTimer=0;spawnEnemy();if(Math.random()<0.3)spawnPower();if(Math.random()<0.2)spawnObstacle();}
 if(enemies.length===0&&powerUps.length===0){wave++;spawnInterval=Math.max(0.5,spawnInterval-0.1);score+=500;}
 if(score>=5000){gameStatus='won';}
}
function fireBullet(){if(fireCooldown<=0){fireCooldown=0.18;bullets.push({x:player.x+player.width/2-3,y:player.y-6,width:6,height:12,vy:-400,color:'#D8125B'});}}
function checkAABB(a,b){return a.x<a.x+b.width&&a.x+a.width>a.x&&a.y<a.y+b.height&&a.y+a.height>b.y;}
function render(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#222';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#0f0';ctx.fillRect(player.x,player.y,player.width,player.height);
 bullets.forEach(b=>{ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.width,b.height);});
 enemies.forEach(e=>{ctx.fillStyle='#f00';ctx.fillRect(e.x,e.y,e.width,e.height);});
 powerUps.forEach(p=>{ctx.fillStyle='#ff0';ctx.fillRect(p.x,p.y,p.width,p.height);});
 obstacles.forEach(o=>{ctx.fillStyle='#888';ctx.fillRect(o.x,o.y,o.width,o.height);});
 ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText('Score:'+score,10,30);
 ctx.fillText('Health:'+player.health,10,60);
 ctx.fillText('Wave:'+wave,10,90);
 ctx.fillText('Status:'+gameStatus,10,120);
}
let lastTime=performance.now();
function loop(now){const dt=Math.min((now-lastTime)/1000,0.1);lastTime=now;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__gameState.player=player;window.__gameState.score=score;window.__gameState.status=gameStatus;window.__gameState.entities={bullets,enemies,powerUps,obstacles};
</script>
<script>
(function () {
  if (window.__gaBridge) return;
  window.__gaBridge = true;
  window.__pressed = window.__pressed || {};
  function setKey(e, on) {
    if (!e) return;
    window.__pressed[e.key] = on;
    window.__pressed[e.code] = on;
    if (e.key) window.__pressed[e.key.toLowerCase()] = on;
  }
  window.addEventListener('keydown', function (e) {
    setKey(e, true);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }, true);
  window.addEventListener('keyup', function (e) { setKey(e, false); }, true);
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type !== 'KEY_EVENT') return;
    var fake = { key: d.key, code: d.code, keyCode: d.keyCode };
    setKey(fake, d.eventType !== 'keyup');
    try {
      var ke = new KeyboardEvent(d.eventType || 'keydown', {
        key: d.key, code: d.code, bubbles: true, cancelable: true
      });
      window.dispatchEvent(ke);
      document.dispatchEvent(ke);
    } catch (err) {}
  });
  function tick() {
    if (window.__gaForceMove === false) {
      requestAnimationFrame(tick);
      return;
    }
    var p = (window.__gameState && window.__gameState.player) || window.player;
    if (p && typeof p.x === 'number') {
      var speed = Number(p.speed) || 5;
      var k = window.__pressed;
      if (k.ArrowLeft || k.a || k.KeyA) p.x -= speed;
      if (k.ArrowRight || k.d || k.KeyD) p.x += speed;
      if (k.ArrowUp || k.w || k.KeyW) p.y -= speed;
      if (k.ArrowDown || k.s || k.KeyS) p.y += speed;
      var c = document.querySelector('canvas');
      var cw = (c && c.width) || 800;
      var ch = (c && c.height) || 600;
      var w = p.width || 24, h = p.height || 24;
      p.x = Math.max(0, Math.min(cw - w, p.x));
      p.y = Math.max(0, Math.min(ch - h, p.y));
      window.__gameState = window.__gameState || {};
      window.__gameState.player = Object.assign({}, window.__gameState.player || {}, {
        x: p.x, y: p.y, width: w, height: h, speed: speed, health: p.health
      });
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  var canvas = document.querySelector('canvas');
  if (canvas) {
    canvas.setAttribute('tabindex', '0');
    canvas.addEventListener('click', function () { canvas.focus(); });
  }
})();
</script>
</body></html>
