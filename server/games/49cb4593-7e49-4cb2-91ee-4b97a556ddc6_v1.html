<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Snake Survival</title>
<style>body{margin:0;background:#222;color:#fff;font-family:sans-serif}</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=600;
const keys={};
window.addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
 keys[e.key]=true;keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{
 keys[e.key]=false;keys[e.key.toLowerCase()]=false;
});
canvas.addEventListener('click',()=>window.focus());
const segSize=20;
let snake=[{x:400,y:300}];
let dir={x:0,y:-1};
let apple={x:0,y:0};
let score=0,hearts=3,status='playing';
function spawnApple(){apple={x:Math.floor(Math.random()*canvas.width/segSize)*segSize,y:Math.floor(Math.random()*canvas.height/segSize)*segSize};}
spawnApple();
let lastTime=performance.now();
function update(dt){
 if(status!=='playing')return;
 if(keys.ArrowUp&&dir.y===0){dir={x:0,y:-1}}
 if(keys.ArrowDown&&dir.y===0){dir={x:0,y:1}}
 if(keys.ArrowLeft&&dir.x===0){dir={x:-1,y:0}}
 if(keys.ArrowRight&&dir.x===0){dir={x:1,y:0}}
 const nx=snake[0].x+dir.x*segSize,ny=snake[0].y+dir.y*segSize;
 if(nx<0||nx>=canvas.width||ny<0||ny>=canvas.height||snake.some(s=>s.x===nx&&s.y===ny)){hearts--;if(hearts===0)status='lost';}
 else{
  snake.unshift({x:nx,y:ny});
  if(nx===apple.x&&ny===apple.y){score+=10;spawnApple();}else snake.pop();
 }
}
function render(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#0f0';
 snake.forEach(s=>ctx.fillRect(s.x,s.y,segSize,segSize));
 ctx.fillStyle='#f00';ctx.fillRect(apple.x,apple.y,segSize,segSize);
 ctx.fillStyle='#fff';ctx.font='20px sans-serif';
 ctx.fillText(`Score: ${score}`,10,30);
 ctx.fillText(`Hearts: ${hearts}`,10,60);
 ctx.fillText(`Status: ${status}`,10,90);
}
function gameLoop(now){
 const dt=Math.min((now-lastTime)/1000,0.1);lastTime=now;
 update(dt);render();
 window.__gameState={player:{x:snake[0].x,y:snake[0].y,width:segSize,height:segSize,health:hearts,speed:segSize},score, status, entities:{snake,apple}};
 requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>

<script>
(function () {
  if (window.__gaBridge) return;
  window.__gaBridge = true;
  window.__pressed = window.__pressed || {};
  function setKey(e, on) {
    if (!e) return;
    window.__pressed[e.key] = on;
    window.__pressed[e.code] = on;
    if (e.key) window.__pressed[e.key.toLowerCase()] = on;
  }
  window.addEventListener('keydown', function (e) {
    setKey(e, true);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }, true);
  window.addEventListener('keyup', function (e) { setKey(e, false); }, true);
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type !== 'KEY_EVENT') return;
    var fake = { key: d.key, code: d.code, keyCode: d.keyCode };
    setKey(fake, d.eventType !== 'keyup');
    try {
      var ke = new KeyboardEvent(d.eventType || 'keydown', {
        key: d.key, code: d.code, bubbles: true, cancelable: true
      });
      window.dispatchEvent(ke);
      document.dispatchEvent(ke);
    } catch (err) {}
  });
  function tick() {
    if (window.__gaForceMove === false) {
      requestAnimationFrame(tick);
      return;
    }
    var p = (window.__gameState && window.__gameState.player) || window.player;
    if (p && typeof p.x === 'number') {
      var speed = Number(p.speed) || 5;
      var k = window.__pressed;
      if (k.ArrowLeft || k.a || k.KeyA) p.x -= speed;
      if (k.ArrowRight || k.d || k.KeyD) p.x += speed;
      if (k.ArrowUp || k.w || k.KeyW) p.y -= speed;
      if (k.ArrowDown || k.s || k.KeyS) p.y += speed;
      var c = document.querySelector('canvas');
      var cw = (c && c.width) || 800;
      var ch = (c && c.height) || 600;
      var w = p.width || 24, h = p.height || 24;
      p.x = Math.max(0, Math.min(cw - w, p.x));
      p.y = Math.max(0, Math.min(ch - h, p.y));
      window.__gameState = window.__gameState || {};
      window.__gameState.player = Object.assign({}, window.__gameState.player || {}, {
        x: p.x, y: p.y, width: w, height: h, speed: speed, health: p.health
      });
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  var canvas = document.querySelector('canvas');
  if (canvas) {
    canvas.setAttribute('tabindex', '0');
    canvas.addEventListener('click', function () { canvas.focus(); });
  }
})();
</script>
</body>
</html>
