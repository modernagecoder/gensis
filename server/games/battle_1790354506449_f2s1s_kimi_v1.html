<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Showdown</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #gameCanvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;
        let lastTime = performance.now();
        let keys = {};
        let player = {
            x: 100,
            y: 100,
            width: 40,
            height: 40,
            health: 100,
            speed: 200
        };
        let score = 0;
        let status = 'playing';
        let entities = [];
        let spawnTimer = 0;
        let hazards = [];
        let collectibles = [];

        window.__gameState = {
            player: {
                x: player.x,
                y: player.y,
                width: player.width,
                height: player.height,
                health: player.health,
                speed: player.speed
            },
            score: score,
            status: status,
            entities: entities
        };

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        canvas.addEventListener('click', () => window.focus());

        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            if (window.__gameState && window.__gameState.status === 'playing') {
                update(dt);
            }
            render();
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);

        function update(dt) {
            if (keys['ArrowLeft']) {
                player.x -= player.speed * dt;
            }
            if (keys['ArrowRight']) {
                player.x += player.speed * dt;
            }
            if (keys['ArrowUp']) {
                player.y -= player.speed * dt;
            }
            if (keys['ArrowDown']) {
                player.y += player.speed * dt;
            }
            if (keys['w']) {
                player.x -= player.speed * dt;
            }
            if (keys['d']) {
                player.x += player.speed * dt;
            }
            if (keys['a']) {
                player.y -= player.speed * dt;
            }
            if (keys['s']) {
                player.y += player.speed * dt;
            }
            if (keys[' ']) {
                player.health += 10;
                if (player.health > 100) {
                    player.health = 100;
                }
            }
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            spawnTimer += dt;
            if (spawnTimer > 0.8) {
                spawnTimer = 0;
                if (hazards.length < 30) {
                    hazards.push({
                        x: Math.random() * (canvas.width - 24),
                        y: -30,
                        width: 24,
                        height: 24,
                        vy: 120 + Math.random() * 100,
                        color: '#D8125B'
                    });
                }
                if (collectibles.length < 15 && Math.random() < 0.4) {
                    collectibles.push({
                        x: Math.random() * (canvas.width - 20),
                        y: -20,
                        width: 20,
                        height: 20,
                        vy: 80 + Math.random() * 60,
                        color: '#F0C020'
                    });
                }
            }

            for (let i = hazards.length - 1; i >= 0; i--) {
                const h = hazards[i];
                h.y += h.vy * dt;
                if (checkAABB(player, h)) {
                    player.health -= 25;
                    hazards.splice(i, 1);
                    if (player.health <= 0) {
                        status = 'lost';
                    }
                } else if (h.y > canvas.height + 50) {
                    hazards.splice(i, 1);
                }
            }

            for (let i = collectibles.length - 1; i >= 0; i--) {
                const c = collectibles[i];
                c.y += c.vy * dt;
                if (checkAABB(player, c)) {
                    score += 10;
                    collectibles.splice(i, 1);
                } else if (c.y > canvas.height + 50) {
                    collectibles.splice(i, 1);
                }
            }

            if (score >= 100) {
                status = 'won';
            }

            window.__gameState = {
                player: {
                    x: player.x,
                    y: player.y,
                    width: player.width,
                    height: player.height,
                    health: player.health,
                    speed: player.speed
                },
                score: score,
                status: status,
                entities: entities
            };
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (window.__gameState && window.__gameState.status === 'playing') {
                ctx.fillStyle = 'white';
                ctx.fillRect(player.x, player.y, player.width, player.height);
                for (let i = hazards.length - 1; i >= 0; i--) {
                    const h = hazards[i];
                    ctx.fillStyle = h.color;
                    ctx.fillRect(h.x, h.y, h.width, h.height);
                }
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    const c = collectibles[i];
                    ctx.fillStyle = c.color;
                    ctx.fillRect(c.x, c.y, c.width, c.height);
                }
                ctx.font = '24px Arial';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`Score: ${window.__gameState.score}`, 10, 10);
                ctx.fillText(`Health: ${window.__gameState.player.health}`, 10, 40);
            } else if (window.__gameState && window.__gameState.status === 'won') {
                ctx.fillStyle = 'white';
                ctx.font = '48px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('You Won!', canvas.width / 2, canvas.height / 2);
                ctx.font = '24px Arial';
                ctx.fillText(`Score: ${window.__gameState.score}`, canvas.width /
