<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>Neon Triangle Rush</title>
<style>body{margin:0;background:#111;color:#0f0;font-family:monospace;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=600;
const keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);
canvas.addEventListener('click',()=>window.focus());
let player={x:360,y:520,width:30,height:30,health:100,speed:200,boost:false,boostTimer:0};
let score=0, status='playing', time=0;
const hazards=[],cores=[];
let spawnTimer=0;
function rect(a,b){return a.x<b.x+a.width&&a.x+a.width>b.x&&a.y<b.y+a.height&&a.y+a.height>b.y;}
function update(dt){
if(status!=='playing')return;
time+=dt;
player.speed=200+time*10;
if(keys.ArrowLeft)player.x-=player.speed*dt;
if(keys.ArrowRight)player.x+=player.speed*dt;
if(keys.Space&&!player.boost){player.boost=true;player.boostTimer=0.3;}
if(player.boost){player.boostTimer-=dt;player.boostTimer<=0&&(player.boost=false);}
if(player.boost)player.speed*=1.5;
player.x=Math.max(0,Math.min(canvas.width-player.width,player.x));
player.y=Math.max(0,Math.min(canvas.height-player.height,player.y));
spawnTimer+=dt;
if(spawnTimer>0.8){spawnTimer=0;if(hazards.length<30)hazards.push({x:Math.random()*(canvas.width-24),y:-30,width:24,height:24,vy:120+Math.random()*100,color:'#D8125B'});if(cores.length<15&&Math.random()<0.4)cores.push({x:Math.random()*(canvas.width-20),y:-20,width:20,height:20,vy:80+Math.random()*60,color:'#F0C020'});}
for(let i=hazards.length-1;i>=0;i--){const h=hazards[i];h.y+=h.vy*dt;if(rect(player,h)){player.health-=25;hazards.splice(i,1);if(player.health<=0)status='lost';}else if(h.y>canvas.height+50)hazards.splice(i,1);}
for(let i=cores.length-1;i>=0;i--){const c=cores[i];c.y+=c.vy*dt;if(rect(player,c)){score+=10;cores.splice(i,1);}else if(c.y>canvas.height+50)cores.splice(i,1);}
score+=Math.floor(dt*1);
if(time>=300&&score>=500)status='won';
}
function render(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#0f0';ctx.fillRect(player.x,player.y,player.width,player.height);
hazards.forEach(h=>{ctx.fillStyle=h.color;ctx.fillRect(h.x,h.y,h.width,h.height);});
cores.forEach(c=>{ctx.fillStyle=c.color;ctx.fillRect(c.x,c.y,c.width,c.height);});
ctx.fillStyle='#fff';ctx.font='16px monospace';ctx.fillText('Score:'+score+'  Health:'+player.health+'  Time:'+Math.floor(time)+'s',10,20);
if(status!=='playing'){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#f00';ctx.font='48px monospace';ctx.textAlign='center';ctx.fillText(status==='won'?'YOU WON!':'GAME OVER',canvas.width/2,canvas.height/2-20);ctx.font='24px monospace';ctx.fillText('Click to restart',canvas.width/2,canvas.height/2+20);}
}
function gameLoop(now){const dt=Math.min((now-lastTime)/1000,0.1);lastTime=now;update(dt);render();requestAnimationFrame(gameLoop);}
let lastTime=performance.now();window.__gameState={player:{x:0,y:0,width:0,height:0,health:0,speed:0},score:0,status:'',entities:[]};
function exposeState(){window.__gameState={player:{...player},score, status, entities:[...hazards,...cores]};}
setInterval(exposeState,100);
canvas.addEventListener('click',()=>{if(status!=='playing'){player={x:360,y:520,width:30,height:30,health:100,speed:200,boost:false,boostTimer:0};score=0;time=0;hazards.length=0;cores.length=0;status='playing';}});
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
