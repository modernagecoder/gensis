        let player={ /* ... */ };

        let targets=[];
        let score=0,status='playing';
        let gameStateInitialized = false;

        function init(){
            if (!gameStateInitialized) {
                ball.x=player.x+player.w/2;
                ball.y=player.y-ball.r;
                ball.vx=ball.vy=0;
                ball.active=false;
                targets=[];
                for(let i=0;i<8;i++)
                    targets.push({x:50+i*90,y:80,w:60,h:20});
                window.__gameState={
                    player:{x:player.x,y:player.y,w:player.w,h:player.h,health:player.health,speed:player.speed},
                    score,
                    status,
                    entities:{ball,targets}
                };
                gameStateInitialized = true;
            }
        }

        function gameLoop(){
            init();
            update(1/60);
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
