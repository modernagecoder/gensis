<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bullet Wave Blitz</title>
<style>
body{margin:0;background:#111;overflow:hidden}
canvas{display:block;margin:auto;background:#222}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
/* ---------- Input handling ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', e => {
  keys[e.key] = false;
  keys[e.key.toLowerCase()] = false;
});

/* ---------- Canvas setup ---------- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 600;
canvas.addEventListener('click', () => window.focus());

/* ---------- Game entities ---------- */
let player = {x:380, y:500, width:40, height:40, health:5, speed:250};
let bullets = [], enemies = [], powerUps = [];
let fireCooldown = 0, spawnTimer = 0, score = 0, status = 'playing', timeSurvived = 0;

/* expose a minimal state object for external bots */
window.__gameState = {
  player: {...player},
  score: 0,
  status: 'playing',
  entities: {bullets: [], enemies: [], powerUps: []}
};

/* ---------- Utility ---------- */
function checkAABB(a, b) {
  return a.x < b.x + b.width && a.x + a.width > b.x &&
         a.y < b.y + b.height && a.y + a.height > b.y;
}

/* ---------- Spawning ---------- */
function spawnEnemy() {
  const size = 30;
  enemies.push({
    x: Math.random() * (canvas.width - size),
    y: -size,
    width: size,
    height: size,
    vy: 100 + Math.random() * 100
  });
}
function spawnPower() {
  const size = 20;
  powerUps.push({
    x: Math.random() * (canvas.width - size),
    y: -size,
    width: size,
    height: size,
    vy: 80
  });
}

/* ---------- Shooting ---------- */
function fireBullet() {
  if (fireCooldown > 0) return;
  fireCooldown = 0.18; // seconds
  // bullet originates from centre top of player
  bullets.push({
    x: player.x + player.width / 2 - 5,
    y: player.y,
    width: 10,
    height: 20,
    vy: -400
  });
}

/* ---------- Game update ---------- */
let lastTime = performance.now();
function update(dt) {
  if (status !== 'playing') return;

  // player movement
  const moveX = (keys['ArrowLeft'] || keys['a'] ? -1 : 0) + (keys['ArrowRight'] || keys['d'] ? 1 : 0);
  const moveY = (keys['ArrowUp'] || keys['w'] ? -1 : 0) + (keys['ArrowDown'] || keys['s'] ? 1 : 0);
  if (moveX !== 0 || moveY !== 0) {
    const len = Math.hypot(moveX, moveY);
    player.x += (moveX / len) * player.speed * dt;
    player.y += (moveY / len) * player.speed * dt;
    // clamp to canvas
    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
  }

  // shooting
  if (keys[' '] || keys['Space']) fireBullet();

  // cooldown timers
  fireCooldown = Math.max(0, fireCooldown - dt);
  spawnTimer += dt;
  if (spawnTimer > 1.0) {
    spawnTimer = 0;
    spawnEnemy();
    if (Math.random() < 0.2) spawnPower();
  }

  // move bullets
  bullets.forEach(b => b.y += b.vy * dt);
  bullets = bullets.filter(b => b.y + b.height > 0);

  // move enemies
  enemies.forEach(e => e.y += e.vy * dt);
