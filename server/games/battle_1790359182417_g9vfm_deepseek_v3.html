<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Triangle Rush</title>
<style>
  body{margin:0;background:#111;color:#fff;font-family:sans-serif;overflow:hidden}
  #gameCanvas{background:#000;display:block;margin:auto}
  #overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="overlay"></div>
<script>
/* ---------- INPUT ---------- */
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup',   e => keys[e.code] = false);

/* ---------- CANVAS ---------- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 600;
canvas.addEventListener('click', () => window.focus());

/* ---------- GAME STATE ---------- */
let player = {x: canvas.width/2-15, y: canvas.height-80, w:30, h:30, health:100, speed:200, dashTimer:0};
let score = 0, time = 0, status = 'playing';
let asteroids = [], cores = [];
let spawnA = 0, spawnC = 0;
const coreGoal = 50, winTime = 300;

/* expose for automated tests */
window.__gameState = { get player(){ return player; }, get status(){ return status; }, get score(){ return score; }};

/* ---------- UTILITIES ---------- */
function checkAABB(a,b){
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}
function reset(){
  player = {x: canvas.width/2-15, y: canvas.height-80, w:30, h:30, health:100, speed:200, dashTimer:0};
  score = 0; time = 0; status = 'playing';
  asteroids = []; cores = []; spawnA = spawnC = 0;
}

/* ---------- UPDATE ---------- */
function update(dt){
  if (status !== 'playing') return;

  time += dt;

  // movement
  if (keys['ArrowLeft']  || keys['KeyA']) player.x -= player.speed * dt;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed * dt;

  // dash
  if (keys['Space'] && player.dashTimer <= 0){
    player.speed *= 2;
    player.dashTimer = 0.3;
  }
  if (player.dashTimer > 0){
    player.dashTimer -= dt;
    if (player.dashTimer <= 0) player.speed /= 2;
  }

  // clamp to canvas
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

  // spawn asteroids
  spawnA += dt;
  if (spawnA > 0.6 && asteroids.length < 30){
    spawnA = 0;
    asteroids.push({
      x: Math.random() * (canvas.width - 40),
      y: -40,
      w: 40,
      h: 40,
      vy: 150 + Math.random() * 100
    });
  }

  // spawn cores
  spawnC += dt;
  if (spawnC > 0.8 && cores.length < 20){
    spawnC = 0;
    if (Math.random() < 0.5){
      cores.push({
        x: Math.random() * (canvas.width - 20),
        y: -20,
        w: 20,
        h: 20,
        vy: 100 + Math.random() * 80
      });
    }
  }

  // update asteroids
  for (let i = asteroids.length - 1; i >= 0; i--){
    const a = asteroids[i];
    a.y += a.vy * dt;
    if (checkAABB(player, a)){
      player.health = 0;
      status = 'lost';
    } else if (a.y > canvas.height){
      asteroids.splice(i, 1);
    }
  }

  // update cores
  for (let i = cores.length - 1; i >= 0; i--){
    const c = cores[i];
    c.y += c.vy * dt;
    if (checkAABB(player, c)){
      score++;
      cores.splice(i, 1);
    } else if (c.y > canvas.height){
      cores.splice(i, 1);
    }
  }

  // win condition
  if (score >= coreGoal && time <= winTime){
    status = 'won';
  }
}

/* ---------- RENDER ---------- */
function draw(){
  // clear background
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // draw player (neon triangle)
  ctx.fillStyle = '#0ff';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y + player.h);
  ctx.lineTo(player.x + player.w/2, player.y);
  ctx.lineTo(player.x + player.w, player.y + player.h);
  ctx.closePath();
  ctx.fill();

  // draw asteroids
  ctx.fillStyle = '#f44';
  asteroids.forEach(a => {
    ctx.fillRect(a.x, a.y, a.w, a.h);
  });

  // draw cores
  ctx.fillStyle = '#4f4';
  cores.forEach(c => {
    ctx.fillRect(c.x, c.y, c.w, c.h);
  });

  // UI
  ctx.fillStyle = '#fff';
  ctx.font = '16px sans-serif';
  ctx.fillText(`Health: ${player.health}`, 10, 20);
  ctx.fillText(`Score: ${score}`, 10, 40);
  ctx.fillText(`Time: ${Math.floor(time)}`, 10, 60);

  if (status === 'lost'){
    ctx.fillStyle = 'rgba(255,0,0
