<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Showdown</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #gameCanvas {
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;
        let lastTime = performance.now();
        let keys = {};
        let player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            width: 50,
            height: 50,
            health: 100,
            speed: 5,
        };
        let score = 0;
        let status = 'playing';
        let entities = [];
        let spawnTimer = 0;
        let gameOver = false;

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        canvas.addEventListener('click', () => {
            window.focus();
        });

        function update(dt) {
            if (status === 'playing') {
                player.x += (keys['ArrowRight'] ? player.speed : 0) - (keys['ArrowLeft'] ? player.speed : 0);
                player.y += (keys['ArrowDown'] ? player.speed : 0) - (keys['ArrowUp'] ? player.speed : 0);
                player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
                player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

                spawnTimer += dt;
                if (spawnTimer > 0.8) {
                    spawnTimer = 0;
                    if (entities.length < 30) {
                        entities.push({
                            x: Math.random() * (canvas.width - 24),
                            y: -30,
                            width: 24,
                            height: 24,
                            vy: 120 + Math.random() * 100,
                            color: '#D8125B',
                        });
                    }
                }

                for (let i = entities.length - 1; i >= 0; i--) {
                    const e = entities[i];
                    e.y += e.vy * dt;
                    if (checkAABB(player, e)) {
                        player.health -= 25;
                        entities.splice(i, 1);
                        if (player.health <= 0) {
                            status = 'lost';
                        }
                    } else if (e.y > canvas.height + 50) {
                        entities.splice(i, 1);
                    }
                }

                if (player.health > 0) {
                    score += 1;
                    if (score % 10 === 0) {
                        player.speed += 1;
                    }
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFF';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.width, e.height);
            }
            ctx.font = '24px Arial';
            ctx.fillStyle = '#FFF';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`Score: ${score}`, 10, 10);
            ctx.fillText(`Health: ${player.health}`, 10, 40);
            ctx.fillText(status, canvas.width / 2 - 50, canvas.height / 2);
            if (status === 'lost') {
                ctx.font = '48px Arial';
                ctx.fillText('Game Over', canvas.width / 2 - 120, canvas.height / 2);
                ctx.font = '24px Arial';
                ctx.fillText('Press Space to restart', canvas.width / 2 - 100, canvas.height / 2 + 50);
            }
        }

        function checkAABB(a, b) {
            return a.x < b.x + b.width &&
                a.x + a.width > b.x &&
                a.y < b.y + b.height &&
                a.y + a.height > b.y;
        }

        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            if (window.__gameState && window.__gameState.status === 'playing') {
                update(dt);
            }
            render();
            if (status === 'lost' && gameOver === false) {
                gameOver = true;
                window.addEventListener('keydown', (e) => {
                    if (e.key === ' ') {
                        window.location.reload();
                    }
                });
            } else if (status === 'playing') {
                window.__gameState = {
                    player: {
                        x: player.x,
                        y: player.y,
                        width: player.width,
                        height: player.height,
                        health: player.health,
                        speed: player.speed,
                    },
                    score: score,
                    status: status,
                    entities: entities,
                };
            }
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);
        window.__gameState = {
            player: {
                x: player.x,
                y: player.y,
                width: player.width,
                height: player.height,
                health: player.health,
                speed: player.speed,
            },
            score: score,
            status: status,
            entities: entities,
        };
    </script>
</body>
</html>
