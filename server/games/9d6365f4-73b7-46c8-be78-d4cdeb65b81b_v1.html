<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Serpent</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f051d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      border: 4px solid #b026ff;
      box-shadow: 0 0 25px rgba(176, 38, 255, 0.6);
      background: #150726;
    }
    .instructions {
      margin-top: 10px;
      font-size: 14px;
      color: #c084fc;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>
<div class="instructions">Use Arrow Keys or WASD to Move | Press 'R' or 'Enter' to Restart</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRID_SIZE = 20;
const COLS = canvas.width / GRID_SIZE;
const ROWS = canvas.height / GRID_SIZE;

const keys = {};
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter'].includes(e.key)) {
    e.preventDefault();
  }
  keys[e.key] = true;
  keys[e.key.toLowerCase()] = true;

  if ((e.key === 'r' || e.key === 'R' || e.key === 'Enter') && window.__gameState.status !== 'playing') {
    resetGame();
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.key] = false;
  keys[e.key.toLowerCase()] = false;
});
canvas.addEventListener('click', () => window.focus());

let snake = [];
let dir = { x: 1, y: 0 };
let nextDir = { x: 1, y: 0 };
let food = { x: 0, y: 0, color: '#ff007f' };
let score = 0;
let status = 'playing'; // 'playing' | 'lost'
let moveTimer = 0;
const moveInterval = 0.1; // seconds per grid step

// Initialize global state
window.__gameState = {
  player: { x: 0, y: 0, width: GRID_SIZE, height: GRID_SIZE, health: 100, speed: 1 },
  score: 0,
  status: status,
  entities: []
};

function resetGame() {
  snake = [
    { x: 10, y: 15 },
    { x: 9, y: 15 },
    { x: 8, y: 15 }
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  status = 'playing';
  moveTimer = 0;
  spawnFood();
}

function spawnFood() {
  let valid = false;
  while (!valid) {
    food.x = Math.floor(Math.random() * COLS);
    food.y = Math.floor(Math.random() * ROWS);
    valid = true;
    for (let part of snake) {
      if (part.x === food.x && part.y === food.y) {
        valid = false;
        break;
      }
    }
  }
}

resetGame();

let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}

function update(dt) {
  // Handle input buffering
  if ((keys['arrowleft'] || keys['a']) && dir.x === 0) {
    nextDir = { x: -1, y: 0 };
  } else if ((keys['arrowright'] || keys['d']) && dir.x === 0) {
    nextDir = { x: 1, y: 0 };
  } else if ((keys['arrowup'] || keys['w']) && dir.y === 0) {
    nextDir = { x: 0, y: -1 };
  } else if ((keys['arrowdown'] || keys['s']) && dir.y === 0) {
    nextDir = { x: 0, y: 1 };
  }

  if (status === 'playing') {
    moveTimer += dt;
    if (moveTimer >= moveInterval) {
      moveTimer = 0;
      dir = nextDir;

      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        status = 'lost';
      }

      // Self collision
      for (let part of snake) {
        if (head.x === part.x && head.y === part.y) {
          status = 'lost';
          break;
        }
      }

      if (status === 'playing') {
        snake.unshift(head);

        // Food collision
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          spawnFood();
        } else {
          snake.pop();
        }
      }
    }
  }

  // Update window.__gameState
  window.__gameState.player = {
    x: snake[0].x * GRID_SIZE,
    y: snake[0].y * GRID_SIZE,
    width: GRID_SIZE,
    height: GRID_SIZE,
    health: status === 'playing' ? 100 : 0,
    speed: 1
  };
  window.__gameState.score = score;
  window.__gameState.status = status;
  window.__gameState.entities = [
    { x: food.x * GRID_SIZE, y: food.y * GRID_SIZE, type: 'food' },
    ...snake.map(s => ({ x: s.x * GRID_SIZE, y: s.y * GRID_SIZE, type: 'snake' }))
  ];
}

function render() {
  // Clear canvas
  ctx.fillStyle = '#150726';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw grid lines subtly
  ctx.strokeStyle = '#220b3a';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * GRID_SIZE, 0);
    ctx.lineTo(i * GRID_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let j = 0; j < ROWS; j++) {
    ctx.beginPath();
    ctx.moveTo(0, j * GRID_SIZE);
    ctx.lineTo(canvas.width, j * GRID_SIZE);
    ctx.stroke();
  }

  // Draw Food
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#ff007f';
  ctx.fillStyle = '#ff007f';
  ctx.fillRect(food.x * GRID_SIZE + 2, food.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);

  // Draw Snake
  for (let i = 0; i < snake.length; i++) {
    const part = snake[i];
    ctx.shadowBlur = i === 0 ? 15 : 5;
    ctx.shadowColor = i === 0 ? '#00ffff' : '#b026ff';
    ctx.fillStyle = i === 0 ? '#00ffff' : '#b026ff';
    ctx.fillRect(part.x * GRID_SIZE + 1, part.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
  }
  ctx.shadowBlur = 0; // reset shadow

  // HUD
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px sans-serif';
  ctx.fillText(`SCORE: ${score}`, 20, 35);

  // Game Over Overlay
  if (status === 'lost') {
    ctx.fillStyle = 'rgba(15, 5, 29, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff007f';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SYSTEM CRASH', canvas.width / 2, canvas.height / 2 - 20);

    ctx.fillStyle = '#ffffff';
    ctx.font = '20px sans-serif';
    ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 25);
    ctx.fillText("Press 'R' or 'Enter' to Reboot", canvas.width / 2, canvas.height / 2 + 65);
    ctx.textAlign = 'left';
  }
}

requestAnimationFrame(gameLoop);
</script>

<script>
(function () {
  if (window.__gaBridge) return;
  window.__gaBridge = true;
  window.__pressed = window.__pressed || {};
  function setKey(e, on) {
    if (!e) return;
    window.__pressed[e.key] = on;
    window.__pressed[e.code] = on;
    if (e.key) window.__pressed[e.key.toLowerCase()] = on;
  }
  window.addEventListener('keydown', function (e) {
    setKey(e, true);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }, true);
  window.addEventListener('keyup', function (e) { setKey(e, false); }, true);
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type !== 'KEY_EVENT') return;
    var fake = { key: d.key, code: d.code, keyCode: d.keyCode };
    setKey(fake, d.eventType !== 'keyup');
    try {
      var ke = new KeyboardEvent(d.eventType || 'keydown', {
        key: d.key, code: d.code, bubbles: true, cancelable: true
      });
      window.dispatchEvent(ke);
      document.dispatchEvent(ke);
    } catch (err) {}
  });
  var canvas = document.querySelector('canvas');
  if (canvas) {
    canvas.setAttribute('tabindex', '0');
    canvas.addEventListener('click', function () { canvas.focus(); });
  }
})();
</script>
</body>
</html>
