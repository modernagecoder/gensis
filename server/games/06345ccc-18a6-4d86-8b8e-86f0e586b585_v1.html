<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bullet Wave Blitz</title>
<style>
body{margin:0;background:#111;overflow:hidden}
canvas{display:block;margin:auto;background:#222}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const keys = {};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key]=true;keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false;});

const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=600;
canvas.addEventListener('click',()=>window.focus());

let player={x:380,y:500,width:40,height:40,health:5,speed:250};
let bullets=[],enemies=[],powerUps=[];
let fireCooldown=0,spawnTimer=0,score=0,status='playing',timeSurvived=0;

window.__gameState={player:null,score:0,status:'playing',entities:{}};

function checkAABB(a,b){
  return a.x<a.x+b.width&&a.x+a.width>b.x&&a.y<a.y+b.height&&a.y+a.height>b.y;
}
function spawnEnemy(){
  const size=30;
  enemies.push({x:Math.random()*(canvas.width-size),y:-size,width:size,height:size,vy:100+Math.random()*100});
}
function spawnPower(){
  const size=20;
  powerUps.push({x:Math.random()*(canvas.width-size),y:-size,width:size,height:size,vy:80});
}
function fireBullet(){
  if(fireCooldown>0)return;
  fireCooldown=0.18;
  bullets.push({x:player.x+player.width/2-3,y:player.y-6,width:6,height:12,vy:-400,color:'#D8125B'});
}
function update(dt){
  // player movement
  if(keys.ArrowLeft) player.x-=player.speed*dt;
  if(keys.ArrowRight) player.x+=player.speed*dt;
  if(keys.ArrowUp) player.y-=player.speed*dt;
  if(keys.ArrowDown) player.y+=player.speed*dt;
  player.x=Math.max(0,Math.min(canvas.width-player.width,player.x));
  player.y=Math.max(0,Math.min(canvas.height-player.height,player.y));
  // shooting
  if(keys[' ']||keys['Space']) fireBullet();
  if(fireCooldown>0) fireCooldown-=dt;
  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.y+=b.vy*dt;
    if(b.y<-20){bullets.splice(i,1);continue;}
    // hit enemies
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(checkAABB(b,e)){
        bullets.splice(i,1);
        enemies.splice(j,1);
        score+=100;
        break;
      }
    }
  }
  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.y+=e.vy*dt;
    if(e.y>canvas.height){enemies.splice(i,1);continue;}
    // enemy bullet (simple)
    if(Math.random()<0.02){
      bullets.push({x:e.x+e.width/2-2,y:e.y+e.height,width:4,height:8,vy:300,color:'#0FF'});
    }
    // collide player
    if(checkAABB(e,player)){
      enemies.splice(i,1);
      player.health--;
      if(player.health<=0) status='lost';
    }
  }
  // power-ups
  for(let i=powerUps.length-1;i>=0;i--){
    const p=powerUps[i];
    p.y+=p.vy*dt;
    if(p.y>canvas.height){powerUps.splice(i,1);continue;}
    if(checkAABB(p,player)){
      powerUps.splice(i,1);
      player.health=Math.min(5,player.health+1);
      score+=50;
    }
  }
  // spawn logic
  spawnTimer+=dt;
  if(spawnTimer>1){
    spawnTimer=0;
    if(Math.random()<0.7) spawnEnemy();
    if(Math.random()<0.1) spawnPower();
  }
  timeSurvived+=dt;
  if(timeSurvived>60 && status==='playing'){status='won';}
}
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // player
  ctx.fillStyle='#4CAF50';
  ctx.fillRect(player.x,player.y,player.width,player.height);
  // bullets
  bullets.forEach(b=>{
    ctx.fillStyle=b.color;
    ctx.fillRect(b.x,b.y,b.width,b.height);
  });
  // enemies
  ctx.fillStyle='#C33';
  enemies.forEach(e=>ctx.fillRect(e.x,e.y,e.width,e.height));
  // power-ups
  ctx.fillStyle='#FF0';
  powerUps.forEach(p=>ctx.fillRect(p.x,p.y,p.width,p.height));
  // HUD
  ctx.fillStyle='#FFF';
  ctx.font='16px sans-serif';
  ctx.fillText('Score: '+score,10,20);
  ctx.fillText('Health: '+player.health,10,40);
  ctx.fillText('Time: '+Math.floor(timeSurvived),10,60);
  if(status!=='playing'){
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#FFF';
    ctx.font='48px sans-serif';
    ctx.textAlign='center';
    ctx.fillText(status==='won'?'YOU WIN!':'GAME OVER',canvas.width/2,canvas.height/2);
    ctx.font='24px sans-serif';
    ctx.fillText('Press R to Restart',canvas.width/2,canvas.height/2+40);
  }
  // expose state
  window.__gameState.player={
<script>
(function () {
  if (window.__gaBridge) return;
  window.__gaBridge = true;
  window.__pressed = window.__pressed || {};
  function setKey(e, on) {
    if (!e) return;
    window.__pressed[e.key] = on;
    window.__pressed[e.code] = on;
    if (e.key) window.__pressed[e.key.toLowerCase()] = on;
  }
  window.addEventListener('keydown', function (e) {
    setKey(e, true);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }, true);
  window.addEventListener('keyup', function (e) { setKey(e, false); }, true);
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type !== 'KEY_EVENT') return;
    var fake = { key: d.key, code: d.code, keyCode: d.keyCode };
    setKey(fake, d.eventType !== 'keyup');
    try {
      var ke = new KeyboardEvent(d.eventType || 'keydown', {
        key: d.key, code: d.code, bubbles: true, cancelable: true
      });
      window.dispatchEvent(ke);
      document.dispatchEvent(ke);
    } catch (err) {}
  });
  function tick() {
    if (window.__gaForceMove === false) {
      requestAnimationFrame(tick);
      return;
    }
    var p = (window.__gameState && window.__gameState.player) || window.player;
    if (p && typeof p.x === 'number') {
      var speed = Number(p.speed) || 5;
      var k = window.__pressed;
      if (k.ArrowLeft || k.a || k.KeyA) p.x -= speed;
      if (k.ArrowRight || k.d || k.KeyD) p.x += speed;
      if (k.ArrowUp || k.w || k.KeyW) p.y -= speed;
      if (k.ArrowDown || k.s || k.KeyS) p.y += speed;
      var c = document.querySelector('canvas');
      var cw = (c && c.width) || 800;
      var ch = (c && c.height) || 600;
      var w = p.width || 24, h = p.height || 24;
      p.x = Math.max(0, Math.min(cw - w, p.x));
      p.y = Math.max(0, Math.min(ch - h, p.y));
      window.__gameState = window.__gameState || {};
      window.__gameState.player = Object.assign({}, window.__gameState.player || {}, {
        x: p.x, y: p.y, width: w, height: h, speed: speed, health: p.health
      });
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  var canvas = document.querySelector('canvas');
  if (canvas) {
    canvas.setAttribute('tabindex', '0');
    canvas.addEventListener('click', function () { canvas.focus(); });
  }
})();
</script>
