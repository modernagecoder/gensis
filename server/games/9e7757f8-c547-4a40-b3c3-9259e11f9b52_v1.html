<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Triangle Dash</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;overflow:hidden}
#gameCanvas{display:block;background:#000}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=600;
const keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  keys[e.key]=true;keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{
  keys[e.key]=false;keys[e.key.toLowerCase()]=false;
});
canvas.addEventListener('click',()=>window.focus());

let player={x:380,y:500,w:30,h:30,health:100,speed:200,dashTimer:0};
let score=0, status='playing', entities=[], spawnTimer=0;
window.__gameState={player:null,score:0,status:'playing',entities:[]};

function reset(){
  player={x:380,y:500,w:30,h:30,health:100,speed:200,dashTimer:0};
  score=0;status='playing';entities=[];spawnTimer=0;
}
function checkAABB(a,b){
  return a.x<a.x+b.w&&a.x+a.w>b.x&&a.y<a.y+b.h&&a.y+a.h>b.y;
}
function update(dt){
  // movement
  let sp=player.speed;
  if(keys[' ']&&player.dashTimer<=0){player.dashTimer=0.3;sp*=2.5;}
  if(player.dashTimer>0){player.dashTimer-=dt;}
  if(keys['ArrowLeft'])player.x-=sp*dt;
  if(keys['ArrowRight'])player.x+=sp*dt;
  if(keys['ArrowUp'])player.y-=sp*dt;
  if(keys['ArrowDown'])player.y+=sp*dt;
  player.x=Math.max(0,Math.min(canvas.width-player.w,player.x));
  player.y=Math.max(0,Math.min(canvas.height-player.h,player.y));
  // spawn
  spawnTimer+=dt;
  if(spawnTimer>0.6){
    spawnTimer=0;
    if(entities.filter(e=>e.type==='barrier').length<30){
      entities.push({type:'barrier',x:Math.random()*(canvas.width-40),y:-40,w:40,h:10,vy:150+Math.random()*100,color:'#0ff'});
    }
    if(Math.random()<0.2 && entities.filter(e=>e.type==='power').length<5){
      entities.push({type:'power',x:Math.random()*(canvas.width-30),y:-30,w:30,h:30,vy:120,color:'#ff0'});
    }
  }
  // update entities
  for(let i=entities.length-1;i>=0;i--){
    const e=entities[i];
    e.y+=e.vy*dt;
    if(e.type==='barrier'){
      if(checkAABB(player,e)){
        player.health-=30;
        entities.splice(i,1);
        if(player.health<=0)status='lost';
      }else if(e.y>canvas.height){
        score+=10;
        entities.splice(i,1);
      }
    }else if(e.type==='power'){
      if(checkAABB(player,e)){
        player.health=Math.min(100,player.health+20);
        score+=50;
        entities.splice(i,1);
      }else if(e.y>canvas.height){
        entities.splice(i,1);
      }
    }
  }
  score+=dt*10;
  if(score>=2000)status='won';
}
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // player triangle
  ctx.fillStyle='#f0f';
  ctx.beginPath();
  ctx.moveTo(player.x+player.w/2,player.y);
  ctx.lineTo(player.x,player.y+player.h);
  ctx.lineTo(player.x+player.w,player.y+player.h);
  ctx.closePath();
  ctx.fill();
  // entities
  entities.forEach(e=>{
    ctx.fillStyle=e.color;
    ctx.fillRect(e.x,e.y,e.w,e.h);
  });
  // HUD
  ctx.fillStyle='#fff';
  ctx.font='16px monospace';
  ctx.fillText(`Score: ${Math.floor(score)}`,10,20);
  ctx.fillText(`Health: ${player.health}`,10,40);
  if(status!=='playing'){
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.font='48px monospace';
    ctx.fillText(status==='won'?'VICTORY':'GAME OVER',canvas.width/2,canvas.height/2);
    ctx.font='20px monospace';
    ctx.fillText('Press R to Restart',canvas.width/2,canvas.height/2+40);
  }
}
function gameLoop(now){
  const dt=Math.min((now-(window.last||now))/1000,0.1);
  window.last=now;
  if(status==='playing')update(dt);
  render();
  // expose state
  window.__gameState.player={x:player.x,y:player.y,width:player.w,height:player.h,health:player.health,speed:player.speed};
  window.__gameState.score=score;
  window.__gameState.status=status;
  window.__gameState.entities=entities.map(e=>({type:e.type,x:e.x,y:e.y,w:e.w,h:e.h}));
  requestAnimationFrame(gameLoop);
}
window.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){if(status!=='playing')reset();}});
requestAnimationFrame(gameLoop);
</script>

<script>
(function () {
  if (window.__gaBridge) return;
  window.__gaBridge = true;
  window.__pressed = window.__pressed || {};
  function setKey(e, on) {
    if (!e) return;
    window.__pressed[e.key] = on;
    window.__pressed[e.code] = on;
    if (e.key) window.__pressed[e.key.toLowerCase()] = on;
  }
  window.addEventListener('keydown', function (e) {
    setKey(e, true);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }, true);
  window.addEventListener('keyup', function (e) { setKey(e, false); }, true);
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type !== 'KEY_EVENT') return;
    var fake = { key: d.key, code: d.code, keyCode: d.keyCode };
    setKey(fake, d.eventType !== 'keyup');
    try {
      var ke = new KeyboardEvent(d.eventType || 'keydown', {
        key: d.key, code: d.code, bubbles: true, cancelable: true
      });
      window.dispatchEvent(ke);
      document.dispatchEvent(ke);
    } catch (err) {}
  });
  function tick() {
    if (window.__gaForceMove === false) {
      requestAnimationFrame(tick);
      return;
    }
    var p = (window.__gameState && window.__gameState.player) || window.player;
    if (p && typeof p.x === 'number') {
      var speed = Number(p.speed) || 5;
      var k = window.__pressed;
      if (k.ArrowLeft || k.a || k.KeyA) p.x -= speed;
      if (k.ArrowRight || k.d || k.KeyD) p.x += speed;
      if (k.ArrowUp || k.w || k.KeyW) p.y -= speed;
      if (k.ArrowDown || k.s || k.KeyS) p.y += speed;
      var c = document.querySelector('canvas');
      var cw = (c && c.width) || 800;
      var ch = (c && c.height) || 600;
      var w = p.width || 24, h = p.height || 24;
      p.x = Math.max(0, Math.min(cw - w, p.x));
      p.y = Math.max(0, Math.min(ch - h, p.y));
      window.__gameState = window.__gameState || {};
      window.__gameState.player = Object.assign({}, window.__gameState.player || {}, {
        x: p.x, y: p.y, width: w, height: h, speed: speed, health: p.health
      });
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  var canvas = document.querySelector('canvas');
  if (canvas) {
    canvas.setAttribute('tabindex', '0');
    canvas.addEventListener('click', function () { canvas.focus(); });
  }
})();
</script>
</body>
</html>
