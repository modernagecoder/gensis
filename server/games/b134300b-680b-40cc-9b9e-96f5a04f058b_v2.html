<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Paddle Pong</title>
<style>
body{margin:0;background:#000;overflow:hidden}
canvas{display:block;margin:auto;background:#111}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  // Store the raw key and its lowercase form
  keys[e.key]=true;
  keys[e.key.toLowerCase()]=true;
  // Normalise space key so that both " " and "Space" are recognised
  if(e.key===' '||e.key==='Space'){
    keys[' ']=true;
    keys['Space']=true;
    keys['space']=true; // lowercase alias for completeness
  }
});
window.addEventListener('keyup',e=>{
  keys[e.key]=false;
  keys[e.key.toLowerCase()]=false;
  if(e.key===' '||e.key==='Space'){
    keys[' ']=false;
    keys['Space']=false;
    keys['space']=false;
  }
});
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=600;
canvas.addEventListener('click',()=>window.focus());

let player={x:350,y:560,w:100,h:20,speed:300,health:3};
let ball={x:0,y:0,r:10,vx:0,vy:0,active:false};
let targets=[];
let score=0,status='playing';

function init(){
  ball.x=player.x+player.w/2;ball.y=player.y-ball.r;ball.vx=ball.vy=0;ball.active=false;
  targets=[];for(let i=0;i<8;i++)targets.push({x:50+i*90,y:80,w:60,h:20});
  window.__gameState={player:{x:player.x,y:player.y,w:player.w,h:player.h,health:player.health,speed:player.speed},score,status,entities:{ball,targets}};
}
function AABB(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function update(dt){
  if(keys.ArrowLeft||keys.ArrowRight){
    const dir=keys.ArrowLeft?-1:1;
    player.x+=dir*player.speed*dt;
  }
  player.x=Math.max(0,Math.min(canvas.width-player.w,player.x));
  if(!ball.active&&(keys[' ']||keys.Space)){
    ball.active=true;ball.vx=200*Math.sign(Math.random()-0.5);ball.vy=-300;
  }
  if(ball.active){
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(ball.x-ball.r<0||ball.x+ball.r>canvas.width)ball.vx*=-1;
    if(ball.y-ball.r<0)ball.vy*=-1;
    if(ball.y+ball.r>canvas.height){
      player.health--;ball.active=false;
      ball.x
