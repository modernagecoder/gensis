<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Paddle Pong</title>
<style>
body{margin:0;background:#000;overflow:hidden}
canvas{display:block;margin:auto;background:#111}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  keys[e.key]=true;keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{
  keys[e.key]=false;keys[e.key.toLowerCase()]=false;
});
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=600;
canvas.addEventListener('click',()=>window.focus());

let player={x:350,y:560,w:100,h:20,speed:300,health:3};
let ball={x:0,y:0,r:10,vx:0,vy:0,active:false};
let targets=[];
let score=0,status='playing';

function init(){
  ball.x=player.x+player.w/2;ball.y=player.y-ball.r;ball.vx=ball.vy=0;ball.active=false;
  targets=[];for(let i=0;i<8;i++)targets.push({x:50+i*90,y:80,w:60,h:20});
  window.__gameState={player:{x:player.x,y:player.y,w:player.w,h:player.h,health:player.health,speed:player.speed},score,status,entities:{ball,targets}};
}
function AABB(a,b){return a.x<a.x+b.w&&a.x+a.w>b.x&&a.y<a.y+b.h&&a.y+a.h>b.y;}
function update(dt){
  if(keys.ArrowLeft||keys.ArrowRight){
    const dir=keys.ArrowLeft?-1:1;
    player.x+=dir*player.speed*dt;
  }
  player.x=Math.max(0,Math.min(canvas.width-player.w,player.x));
  if(!ball.active&&(keys[' ']||keys.Space)){
    ball.active=true;ball.vx=200*Math.sign(Math.random()-0.5);ball.vy=-300;
  }
  if(ball.active){
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(ball.x-ball.r<0||ball.x+ball.r>canvas.width)ball.vx*=-1;
    if(ball.y-ball.r<0)ball.vy*=-1;
    if(ball.y+ball.r>canvas.height){
      player.health--;ball.active=false;
      ball.x=player.x+player.w/2;ball.y=player.y-ball.r;
      if(player.health<=0)status='lost';
    }
    if(AABB({x:ball.x-ball.r,y:ball.y-ball.r,w:ball.r*2,h:ball.r*2},{x:player.x,y:player.y,w:player.w,h:player.h})){
      ball.vy=-Math.abs(ball.vy);ball.y=player.y-ball.r;
    }
    for(let i=targets.length-1;i>=0;i--){
      const t=targets[i];
      if(AABB({x:ball.x-ball.r,y:ball.y-ball.r,w:ball.r*2,h:ball.r*2},{x:t.x,y:t.y,w:t.w,h:t.h})){
        ball.vy*=-1;score+=10;targets.splice(i,1);
        if(targets.length===0)status='won';
      }
    }
  }
  window.__gameState.player={x:player.x,y:player.y,w:player.w,h:player.h,health:player.health,speed:player.speed};
  window.__gameState.score=score;
  window.__gameState.status=status;
  window.__gameState.entities={ball:{x:ball.x,y:ball.y,r:ball.r,active:ball.active},targets:targets.map(t=>({x:t.x,y:t.y,w:t.w,h:t.h}))};
}
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0ff';ctx.fillRect(player.x,player.y,player.w,player.h);
  if(ball.active){ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,2*Math.PI);ctx.fill();}
  ctx.fillStyle='#f22';targets.forEach(t=>ctx.fillRect(t.x,t.y,t.w,t.h));
  ctx.fillStyle='#fff';ctx.font='16px monospace';
  ctx.fillText(`Score: ${score}`,10,20);
  ctx.fillText(`Lives: ${player.health}`,10,40);
  if(status!=='playing')ctx.fillText(status.toUpperCase(),canvas.width/2-40,canvas.height/2);
}
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.1);
  last=now;
  if(status==='playing')update(dt);
  render();
  requestAnimationFrame(loop);
}
init();
requestAnimationFrame(loop);
</script>

<script>
(function () {
  if (window.__gaBridge) return;
  window.__gaBridge = true;
  window.__pressed = window.__pressed || {};
  function setKey(e, on) {
    if (!e) return;
    window.__pressed[e.key] = on;
    window.__pressed[e.code] = on;
    if (e.key) window.__pressed[e.key.toLowerCase()] = on;
  }
  window.addEventListener('keydown', function (e) {
    setKey(e, true);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }, true);
  window.addEventListener('keyup', function (e) { setKey(e, false); }, true);
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type !== 'KEY_EVENT') return;
    var fake = { key: d.key, code: d.code, keyCode: d.keyCode };
    setKey(fake, d.eventType !== 'keyup');
    try {
      var ke = new KeyboardEvent(d.eventType || 'keydown', {
        key: d.key, code: d.code, bubbles: true, cancelable: true
      });
      window.dispatchEvent(ke);
      document.dispatchEvent(ke);
    } catch (err) {}
  });
  function tick() {
    if (window.__gaForceMove === false) {
      requestAnimationFrame(tick);
      return;
    }
    var p = (window.__gameState && window.__gameState.player) || window.player;
    if (p && typeof p.x === 'number') {
      var speed = Number(p.speed) || 5;
      var k = window.__pressed;
      if (k.ArrowLeft || k.a || k.KeyA) p.x -= speed;
      if (k.ArrowRight || k.d || k.KeyD) p.x += speed;
      if (k.ArrowUp || k.w || k.KeyW) p.y -= speed;
      if (k.ArrowDown || k.s || k.KeyS) p.y += speed;
      var c = document.querySelector('canvas');
      var cw = (c && c.width) || 800;
      var ch = (c && c.height) || 600;
      var w = p.width || 24, h = p.height || 24;
      p.x = Math.max(0, Math.min(cw - w, p.x));
      p.y = Math.max(0, Math.min(ch - h, p.y));
      window.__gameState = window.__gameState || {};
      window.__gameState.player = Object.assign({}, window.__gameState.player || {}, {
        x: p.x, y: p.y, width: w, height: h, speed: speed, health: p.health
      });
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  var canvas = document.querySelector('canvas');
  if (canvas) {
    canvas.setAttribute('tabindex', '0');
    canvas.addEventListener('click', function () { canvas.focus(); });
  }
})();
</script>
</body>
</html>
