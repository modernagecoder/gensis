<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Triangle Rush</title>
<style>
  body{margin:0;background:#111;color:#fff;font-family:sans-serif;overflow:hidden}
  #gameCanvas{background:#000;display:block;margin:auto}
  #overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="overlay"></div>
<script>
const keys={};
window.addEventListener('keydown',e=>keys[e.code]=true);
window.addEventListener('keyup',e=>keys[e.code]=false);
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=600;
canvas.addEventListener('click',()=>window.focus());

let player={x:canvas.width/2-15,y:canvas.height-80,w:30,h:30,health:100,speed:200, dashTimer:0};
let score=0, time=0, status='playing';
let asteroids=[], cores=[];
let spawnA=0, spawnC=0;
const coreGoal=50, winTime=300;

function checkAABB(a,b){
  return a.x<a.x+b.w&&a.x+a.w>b.x&&a.y<a.y+b.h&&a.y+a.h>b.y;
}
function reset(){
  player={x:canvas.width/2-15,y:canvas.height-80,w:30,h:30,health:100,speed:200,dashTimer:0};
  score=0;time=0;status='playing';asteroids=[];cores=[];spawnA=spawnC=0;
}
function update(dt){
  time+=dt;
  // movement
  if(keys['ArrowLeft']) player.x-=player.speed*dt;
  if(keys['ArrowRight']) player.x+=player.speed*dt;
  // dash
  if(keys['Space'] && player.dashTimer<=0){
    player.speed*=2; player.dashTimer=0.3;
  }
  if(player.dashTimer>0){
    player.dashTimer-=dt;
    if(player.dashTimer<=0) player.speed/=2;
  }
  // clamp
  player.x=Math.max(0,Math.min(canvas.width-player.w,player.x));
  // spawn
  spawnA+=dt; spawnC+=dt;
  if(spawnA>0.6 && asteroids.length<30){
    spawnA=0;
    asteroids.push({x:Math.random()*(canvas.width-40),y:-40,w:40,h:40,vy:150+Math.random()*100});
  }
  if(spawnC>0.8 && cores.length<20){
    spawnC=0;
    if(Math.random()<0.5){
      cores.push({x:Math.random()*(canvas.width-20),y:-20,w:20,h:20,vy:100+Math.random()*80});
    }
  }
  // update asteroids
  for(let i=asteroids.length-1;i>=0;i--){
    const a=asteroids[i];
    a.y+=a.vy*dt;
    if(checkAABB(player,a)){
      player.health=0; status='lost';
    }else if(a.y>canvas.height) asteroids.splice(i,1);
  }
  // update cores
  for(let i=cores.length-1;i>=0;i--){
    const c=cores[i];
    c.y+=c.vy*dt;
    if(checkAABB(player,c)){
      score+=10; cores.splice(i,1);
    }else if(c.y>canvas.height) cores.splice(i,1);
  }
  // scoring over time
  score+=dt;
  // win/lose
  if(player.health<=0) status='lost';
  if(time>=winTime && score>=coreGoal*10) status='won';
}
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // background grid
  ctx.strokeStyle='#222';ctx.lineWidth=1;
  for(let x=0;x<canvas.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
  for(let y=0;y<canvas.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
  // player triangle
  ctx.fillStyle='#0ff';
  ctx.beginPath();
  ctx.moveTo(player.x+player.w/2,player.y);
  ctx.lineTo(player.x,player.y+player.h);
  ctx.lineTo(player.x+player.w,player.y+player.h);
  ctx.closePath();ctx.fill();
  // asteroids
  ctx.fillStyle='#d33';
  asteroids.forEach(a=>{ctx.fillRect(a.x,a.y,a.w,a.h);});
  // cores
  ctx.fillStyle='#ff0';
  cores.forEach(c=>{ctx.fillRect(c.x,c.y,c.w,c.h);});
  // HUD
  ctx.fillStyle='#fff';
  ctx.font='16px sans-serif';
  ctx.fillText(`Score: ${Math.floor(score)}`,10,20);
  ctx.fillText(`Time: ${Math.floor(time)}s`,10,40);
  ctx.fillText(`Cores: ${Math.floor(score/10)}/${coreGoal}`,10,60);
  if(status!=='playing'){
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.font='48px sans-serif';
    ctx.fillText(status==='won'?'VICTORY':'GAME OVER',canvas.width/2,canvas.height/2);
    ctx.font='24px sans-serif';
    ctx.fillText('Press R to Restart',canvas.width/2,canvas.height/2+40);
  }
}
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.1);
  last=now;
  if(window.__gameState && window.__gameState.status==='playing') update(dt);
  render();
  window.__gameState={player:{x:player.x,y:player.y,width:player.w,height:player.h,health:player.health,speed:player.speed},score:Math.floor(score),status,entities:{asteroids,cores}};
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.addEventListener('keydown',e=>{if(e.code==='KeyR' && status!=='playing') reset();});
</script>
</
