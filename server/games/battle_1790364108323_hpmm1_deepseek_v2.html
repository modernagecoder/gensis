<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neon Brick Breaker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0e15;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    canvas {
      background: #131522;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
      border-radius: 8px;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.setAttribute('tabindex', '1');
canvas.addEventListener('click', () => canvas.focus());
canvas.focus();

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === 'r' || e.key === 'R' || e.key === 'Enter') && (status === 'lost' || status === 'won')) {
    initGame();
  }
});
window.addEventListener('keyup', e => {
  keys[e.key] = false;
});

let score = 0;
let status = 'playing';

let player = {
  x: 350,
  y: 550,
  width: 100,
  height: 16,
  speed: 500,
  health: 3,
  color: '#00f3ff'
};

let ball = {
  x: 400,
  y: 530,
  radius: 8,
  vx: 200,
  vy: -250,
  color: '#ff0055'
};

let bricks = [];

function initGame() {
  score = 0;
  status = 'playing';
  player.x = 350;
  player.health = 3;
  
  ball.x = 400;
  ball.y = 530;
  ball.vx = 220 + Math.random() * 60 - 30;
  ball.vy = -300;

  bricks = [];
  const rows = 5;
  const cols = 10;
  const padding = 10;
  const offsetTop = 60;
  const offsetLeft = 35;
  const brickWidth = 68;
  const brickHeight = 24;

  const colors = ['#ff0055', '#ff9900', '#ffff00', '#00ff66', '#00f3ff'];

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      bricks.push({
        x: offsetLeft + c * (brickWidth + padding),
        y: offsetTop + r * (brickHeight + padding),
        width: brickWidth,
        height: brickHeight,
        color: colors[r],
        points: (rows - r) * 10,
        active: true
      });
    }
  }
}

initGame();

function update(dt) {
  // Paddle movement
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
    player.x -= player.speed * dt;
  }
  if (keys['ArrowRight'] || keys['d'] || keys['D']) {
    player.x += player.speed * dt;
  }

  // Boundary clamping
  player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

  // Ball movement
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  // Wall collisions
  if (ball.x - ball.radius < 0) {
    ball.x = ball.radius;
    ball.vx *= -1;
  }
  if (ball.x + ball.radius > canvas.width) {
    ball.x = canvas.width - ball.radius;
    ball.vx *= -1;
  }
  if (ball.y - ball.radius < 0) {
    ball.y = ball.radius;
    ball.vy *= -1;
  }

  // Bottom collision (Lose life)
  if (ball.y - ball.radius > canvas.height) {
    player.health -= 1;
    if (player.health <= 0) {
      status = 'lost';
    } else {
      // Reset ball
      ball.x = player.x + player.width / 2;
      ball.y = player.y - 15;
      ball.vx = 200 * (Math.random() > 0.5 ? 1 : -1);
      ball.vy = -280;
    }
  }

  // Paddle collision
  if (
    ball.x + ball.radius > player.x &&
    ball.x - ball.radius < player.x + player.width &&
    ball.y + ball.radius > player.y &&
    ball.y - ball.radius < player.y + player.height
  ) {
    ball.y = player.y - ball.radius;
    let hitPos = (ball.x - (player.x + player.width / 2)) / (player.width / 2);
    let speed = Math.hypot(ball.vx, ball.vy);
    let angle = hitPos * (Math.PI / 3);
    ball.vx = speed * Math.sin(angle);
    ball.vy = -Math.abs(speed * Math.cos(angle));
  }

  // Brick collisions
  let activeBricksCount = 0;
  for (let i = 0; i < bricks.length; i++) {
    let b = bricks[i];
    if (!b.active) continue;
    activeBricksCount++;

    if (
      ball.x + ball.radius > b.x &&
      ball.x - ball.radius < b.x + b.width &&
      ball.y + ball.radius > b.y &&
      ball.y - ball.radius < b.y + b.height
    ) {
      b.active = false;
      score += b.points;
      ball.vy *= -1;
      break;
    }
  }

  if (activeBricksCount === 0) {
    status = 'won';
  }

  // Update gameState for automated inspection
  window.__gameState = {
    player: { x: player.x, y: player.y, width: player.width, height: player.height, health: player.health, speed: player.speed },
    score: score,
    status: status,
    entities: [
      { type: 'ball', x: ball.x, y: ball.y, radius: ball.radius },
      ...bricks.filter(b => b.active)
    ]
  };
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw Bricks
  for (let i = 0; i < bricks.length; i++) {
    let b = bricks[i];
    if (!b.active) continue;
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 8;
    ctx.fillRect(b.x, b.y, b.width, b.height);
  }
  ctx.shadowBlur = 0;

  // Draw Player Paddle
  ctx.fillStyle = player.color;
  ctx.shadowColor = player.color;
  ctx.shadowBlur = 12;
  ctx.fillRect(player.x, player.y, player.width, player.height);
  ctx.shadowBlur = 0;

  // Draw Ball
  ctx.fillStyle = ball.color;
  ctx.shadowColor = ball.color;
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Draw HUD
  ctx.fillStyle = '#ffffff';
  ctx.font = '16px sans-serif';
  ctx.fillText('Score: ' + score, 25, 30);
  ctx.fillText('Lives: ' + player.health, canvas.width - 90, 30);

  // Overlays
  if (status !== 'playing') {
    ctx.fillStyle = 'rgba(13, 14, 21, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = status === 'won' ? '#00ff66' : '#ff0055';
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(status === 'won' ? 'VICTORY!' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

    ctx.fillStyle = '#ffffff';
    ctx.font = '20px sans-serif';
    ctx.fillText('Press R or ENTER to Restart', canvas.width / 2, canvas.height / 2 + 30);
    ctx.textAlign = 'left';
  }
}

let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  if (status === 'playing') {
    update(dt);
  } else {
    // Always update gameState even if not playing so inspection passes
    window.__gameState = {
      player: { x: player.x, y: player.y, width: player.width, height: player.height, health: player.health, speed: player.speed },
      score: score,
      status: status,
      entities: [
        { type: 'ball', x: ball.x, y: ball.y, radius: ball.radius },
        ...bricks.filter(b => b.active)
      ]
    };
  }
  render();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
</body>
</html>
