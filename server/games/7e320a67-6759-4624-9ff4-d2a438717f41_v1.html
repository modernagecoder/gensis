<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bullet Dodge</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        #canvas {
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const keys = {};

        let player = {
            x: 400,
            y: 300,
            width: 50,
            height: 50,
            health: 100,
            speed: 5,
            color: 'red'
        };

        let score = 0;
        let status = 'playing';
        let entities = [];

        let bullets = [];
        let powerUps = [];

        let gameOver = false;

        let winTime = 60; // seconds
        let currentTime = 0;

        function update() {
            if (gameOver) {
                return;
            }

            window.__gameState = {
                player: {
                    x: player.x,
                    y: player.y,
                    width: player.width,
                    height: player.height,
                    health: player.health,
                    speed: player.speed
                },
                score: score,
                status: status,
                entities: entities
            };

            if (keys.ArrowLeft || keys.a) {
                player.x -= player.speed;
            }
            if (keys.ArrowRight || keys.d) {
                player.x += player.speed;
            }
            if (keys.ArrowUp || keys.w) {
                player.y -= player.speed;
            }
            if (keys.ArrowDown || keys.s) {
                player.y += player.speed;
            }

            if (player.x < 0) {
                player.x = 0;
            }
            if (player.x > canvas.width - player.width) {
                player.x = canvas.width - player.width;
            }
            if (player.y < 0) {
                player.y = 0;
            }
            if (player.y > canvas.height - player.height) {
                player.y = canvas.height - player.height;
            }

            // update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].speedX;
                bullets[i].y += bullets[i].speedY;

                if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                    bullets.splice(i, 1);
                } else {
                    // check collision with player
                    if (checkCollision(bullets[i], player)) {
                        player.health -= 10;
                        bullets.splice(i, 1);
                    }
                }
            }

            // update power-ups
            for (let i = powerUps.length - 1; i >= 0; i--) {
                powerUps[i].x += powerUps[i].speedX;
                powerUps[i].y += powerUps[i].speedY;

                if (powerUps[i].x < 0 || powerUps[i].x > canvas.width || powerUps[i].y < 0 || powerUps[i].y > canvas.height) {
                    powerUps.splice(i, 1);
                } else {
                    // check collision with player
                    if (checkCollision(powerUps[i], player)) {
                        score += 10;
                        powerUps.splice(i, 1);
                    }
                }
            }

            // update entities
            for (let i = entities.length - 1; i >= 0; i--) {
                entities[i].x += entities[i].speedX;
                entities[i].y += entities[i].speedY;

                if (entities[i].x < 0 || entities[i].x > canvas.width || entities[i].y < 0 || entities[i].y > canvas.height) {
                    entities.splice(i, 1);
                }
            }

            // check win condition
            currentTime++;
            if (currentTime >= winTime * 60) {
                status = 'won';
                gameOver = true;
            }

            // check loss condition
            if (player.health <= 0) {
                status = 'lost';
                gameOver = true;
            }

            requestAnimationFrame(draw);
        }

        function draw() {
            window.__gameState = {
                player: {
                    x: player.x,
                    y: player.y,
                    width: player.width,
                    height: player.height,
                    health: player.health,
                    speed: player.speed
                },
                score: score,
                status: status,
                entities: entities
            };

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // draw player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // draw bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                ctx.fillStyle = 'blue';
                ctx.fillRect(bullets[i].x, bullets[i].y, 10, 10);
            }

            // draw power-ups
            for (let i = powerUps.length - 1; i >= 0; i--) {
                ctx.fillStyle = 'green';
                ctx.fillRect(powerUps[i].x, powerUps[i].y, 20, 20);
            }

            // draw entities
            for (let i = entities.length - 1; i >= 0; i--) {
                ctx.fillStyle = 'black';
                ctx.fillRect(entities[i].x, entities[i].y, entities[i].width, entities[i].height);
            }

            // draw score and health
            ctx.fillStyle = 'white';
            ctx.font = '24px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Score: ' + score, 10, 10);
            ctx.fillText('Health: ' + player.health, 10, 40);

            // draw game over screen
            if (gameOver) {
                ctx.fillStyle = 'white';
                ctx.font = '48px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(status === 'won' ? 'You Won!' : 'Game Over!', canvas.width / 2, canvas.height / 2);
                ctx.font = '24px Arial';
                ctx.fillText('Press Space to restart', canvas.width / 2, canvas.height / 2 + 50);
            }

            // draw controls hint
            ctx.fillStyle = 'white';
            ctx.font = '18px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Controls: Arrow keys or WASD', 10, canvas.height - 30);
        }

        function checkCollision(rect1, rect2) {
            if (rect1.x + rect1.width < rect2.x || rect1.x > rect2.x + rect2.width) {
                return false;
            }
            if (rect1.y + rect1.height < rect2.y || rect1.y > rect2.y + rect2.height) {
                return false;
            }
            return true;
        }

        function createBullet() {
            let bullet = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                speedX: Math.random() * 5 - 2.5,
                speedY: Math.random() * 5 - 2.5
            };
            bullets.push(bullet);
        }

        function createPowerUp() {
            let powerUp = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                speedX: Math.random() * 2 - 1,
                speedY: Math.random() * 2 - 1
            };
            powerUps.push(powerUp);
        }

        function createEntity() {
            let entity = {
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speedX: Math.random() * 2 - 1,
                speedY: Math.random() * 2 - 1,
                width: 20,
                height: 20
            };
            entities.push(entity);
        }

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'w', 'a', 's', 'd'].includes(e.key)) {
                e.preventDefault();
            }
            keys[e.key] = true;
            keys[e.key.toLowerCase()] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            keys[e.key.toLowerCase()] = false;
        });

        canvas.addEventListener('click', () => {
            window.focus();
        });

        // create initial entities
        for (let i = 0; i < 10; i++) {
            createBullet();
            createPowerUp();
            createEntity();
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
