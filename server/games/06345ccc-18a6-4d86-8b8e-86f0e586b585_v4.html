<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bullet Wave Blitz</title>
<style>
body{margin:0;background:#111;overflow:hidden}
canvas{display:block;margin:auto;background:#222}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
/* ---------- Input handling ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', e => {
  keys[e.key] = false;
  keys[e.key.toLowerCase()] = false;
});

/* ---------- Canvas setup ---------- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 600;
canvas.addEventListener('click', () => window.focus());

/* ---------- Game entities ---------- */
let player = {x:380, y:500, width:40, height:40, health:5, speed:250};
let bullets = [], enemies = [], powerUps = [];
let fireCooldown = 0, spawnTimer = 0, score = 0, status = 'playing', timeSurvived = 0;

/* expose a minimal state object for external bots */
window.__gameState = {
  player: {...player},
  score: 0,
  status: 'playing',
  entities: {bullets: [], enemies: [], powerUps: []}
};

/* ---------- Utility ---------- */
function checkAABB(a, b) {
  return a.x < b.x + b.width && a.x + a.width > b.x &&
         a.y < b.y + b.height && a.y + a.height > b.y;
}

/* ---------- Spawning ---------- */
function spawnEnemy() {
  const size = 30;
  enemies.push({
    x: Math.random() * (canvas.width - size),
    y: -size,
    width: size,
    height: size,
    vy: 100 + Math.random() * 100
  });
}
function spawnPower() {
  const size = 20;
  powerUps.push({
    x: Math.random() * (canvas.width - size),
    y: -size,
    width: size,
    height: size,
    vy: 80
  });
}

/* ---------- Shooting ---------- */
function fireBullet() {
  if (fireCooldown > 0) return;
  fireCooldown = 0.18;
  bullets.push({
    x: player.x + player.width / 2 - 3,
    y: player.y - 6,
    width: 6,
    height: 12,
    vy: -400,
    color: '#D8125B'
  });
}

/* ---------- Game update ---------- */
function update(dt) {
  // player movement
  if (keys.ArrowLeft)  player.x -= player.speed * dt;
  if (keys.ArrowRight) player.x += player.speed * dt;
  if (keys.ArrowUp)    player.y -= player.speed * dt;
  if (keys.ArrowDown)  player.y += player.speed * dt;
  player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

  // shooting
  if (keys[' ']) fireBullet();          // space bar
  if (fireCooldown > 0) fireCooldown -= dt;

  // bullets (player)
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y += b.vy * dt;
    if (b.y < -20) { bullets.splice(i, 1); continue; }

    // hit enemies
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (checkAABB(b, e)) {
        bullets.splice(i, 1);
        enemies.splice(j, 1);
        score += 100;
        break;
      }
    }
  }

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.vy * dt;
    if (e.y > canvas.height) { enemies.splice(i, 1); continue; }

    // enemy bullet (simple)
    if (Math.random() < 0.02) {
      bullets.push({
        x: e.x + e.width / 2 - 2,
        y: e.y + e.height,
        width: 4,
        height: 8,
        vy: 300,
        color: '#0FF'
      });
    }

    // collide player
    if (checkAABB(e, player)) {
      // simple damage
