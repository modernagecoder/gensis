<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cyber Samurai Slash</title>
<style>
  body{margin:0;overflow:hidden;background:#222;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=800;
canvas.height=600;

const keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);
canvas.addEventListener('click',()=>window.focus());

let lastTime=performance.now(),score=0,combo=0,wave=1,status='playing';
const player={
  x:400,y:500,width:32,height:32,
  health:100,speed:200,dashTime:0
};
const drones=[],shurikens=[],powerups=[];
let spawnTimer=0,fireCooldown=0;
const bullets=[];

// Helper: Axis-aligned bounding box collision
function checkAABB(a,b){
  return a.x<b.x+a.width && a.x+a.width>b.x &&
         a.y<b.y+a.height && a.y+a.height>b.y;
}

// Update game state
function update(dt){
  if(status!=='playing')return;

  // Dash handling
  player.dashTime=Math.max(0,player.dashTime-dt);
  if(keys['Shift']||keys['shift']){
    player.dashTime=0.2;
    player.speed=400;
  }else{
    player.speed=200;
  }

  // Movement – support both arrow keys and WASD
  const moveX = (keys['ArrowRight']||keys['d']) - (keys['ArrowLeft']||keys['a']);
  const moveY = (keys['ArrowDown']||keys['s']) - (keys['ArrowUp']||keys['w']);
  player.x += moveX * player.speed * dt;
  player.y += moveY * player.speed * dt;

  // Shooting
  if(keys[' ']){fireCooldown=0;}
  fireCooldown=Math.max(0,fireCooldown-dt);
  if(keys[' ']){fireBullet();}

  // Spawn enemies
  spawnTimer+=dt;
  if(spawnTimer>1){
    spawnTimer=0;
    spawnWave();
  }

  // Update drones
  for(let i=drones.length-1;i>=0;i--){
    const d=drones[i];
    d.y+=d.vy*dt; d.x+=d.vx*dt;
    if(checkAABB(player,d)){
      player.health-=20;
      drones.splice(i,1);
      if(player.health<=0)status='lost';
    }else if(d.y>canvas.height+50||d.x<-50||d.x>canvas.width+50){
      drones.splice(i,1);
    }
  }

  // Update shurikens
  for(let i=shurikens.length-1;i>=0;i--){
    const s=shurikens[i];
    s.y+=s.vy*dt;
    if(checkAABB(player,s)){
      player.health=0;
      shurikens.splice(i,1);
      status='lost';
    }else if(s.y>canvas.height+50){
      shurikens.splice(i,1);
    }
  }

  // Update powerups
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];
    p.y+=p.vy*dt;
    if(checkAABB(player,p)){
      score+=500;
      powerups.splice(i,1);
    }else if(p.y>canvas.height+50){
      powerups.splice(i,1);
    }
  }

  // Update bullets (not used in original but added for completeness)
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.y+=b.vy*dt;
    if(b.y<0)bullets.splice(i,1);
  }

  // Bounds clamp
  player.x=Math.max(0,Math.min(canvas.width-player.width,player.x));
  player.y=Math.max(0,Math.min(canvas.height-player.height,player.y));

  // Win condition
  if(wave>5 && score>=10000)status='won';
}

// Render
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#222';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Player
  ctx.fillStyle='#0f0';
  ctx.fillRect(player.x,player.y,player.width,player.height);

  // Drones
  drones.forEach(d=>{
    ctx.fillStyle=d.color;
    ctx.fillRect(d.x,d.y,d.width,d.height);
  });

  // Shurikens
  shurikens.forEach(s=>{
    ctx.fillStyle=s.color;
    ctx.fillRect(s.x,s.y,s.width,s.height);
  });

  // Powerups
  powerups.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.width,p.height);
  });

  // Bullets
  bullets.forEach(b=>{
    ctx.fillStyle=b.color;
    ctx.fillRect(b.x,b.y,b.width,b.height);
  });

  // HUD
  ctx.fillStyle='#fff';
  ctx.font='16px sans-serif';
  ctx.fillText('Health:'+player.health,10,20);
  ctx.fillText('Score:'+score,10,40);
  ctx.fillText('Wave:'+wave,10,60);

  // Game over / win overlay
  if(status!=='playing'){
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect
