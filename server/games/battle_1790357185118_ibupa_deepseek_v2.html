<html lang="en">

<meta charset="UTF-8">
<title>Neon Astro Rush</title>
<style>
  body{margin:0;background:#000;overflow:hidden;font-family:sans-serif;color:#0ff;}

<body>
<canvas id="gameCanvas"></canvas>
<script>
/* ---------- INPUT ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  // ignore repeat events
  if (e.repeat) return;
  keys[e.code] = true;
  // restart on R (only when not playing)
  if (e.code === 'KeyR' && window.__gameState?.status !== 'playing') reset();
  // prevent arrow keys / space from scrolling the page
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD'].includes(e.code))
    e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
});

/* ---------- CANVAS ---------- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 600;
canvas.addEventListener('click', () => window.focus());

/* ---------- GAME STATE ---------- */
let player, fuel, distance, score, status, entities, spawnTimer, requiredFuel, collectedFuel;

function init() {
  player = { x: canvas.width / 2 - 20, y: canvas.height - 80, w: 40, h: 40, health: 100, speed: 200 };
  fuel = 100;
  distance = 0;
  score = 0;
  status = 'playing';
  entities = [];
  spawnTimer = 0;
  requiredFuel = 10;
  collectedFuel = 0;
  window.__gameState = {
    player: { ...player },
    score,
    status,
    entities
  };
}
function reset() { init(); }

/* ---------- UTILITIES ---------- */
function checkAABB(a, b) {
  // proper axis‑aligned bounding‑box overlap test
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

/* ---------- SPAWNING ---------- */
function spawn(dt) {
  spawnTimer += dt;
  if (spawnTimer > 0.5) {
    spawnTimer = 0;
    if (entities.length < 40) {
      // obstacle
      entities.push({
        type: 'obstacle',
        x: Math.random() * (canvas.width - 30),
        y: -30,
        w: 30,
        h: 30,
        vy: 150 + Math.random() * 100,
        color: '#D8125B'
      });
      // fuel cell (40% chance)
      if (Math.random() < 0.4) {
        entities.push({
          type: 'fuel',
          x: Math.random() * (canvas.width - 20),
          y: -20,
          w: 20,
          h: 20,
          vy: 100 + Math.random() * 80,
          color: '#F0C020'
        });
      }
    }
  }
}

/* ---------- UPDATE ---------- */
function update(dt) {
  // ----- movement -----
  let dx = 0, dy = 0;
  // Arrow keys
  if (keys['ArrowLeft'])  dx--;
  if (keys['ArrowRight']) dx++;
  if (keys['ArrowUp'])    dy--;
  if (keys['ArrowDown'])  dy++;
  // WASD keys (aliases)
  if (keys['KeyA']) dx--;
  if (keys['KeyD']) dx++;
  if (keys['KeyW']) dy--;
  if (keys['KeyS']) dy++;

  const norm = Math.hypot(dx, dy) || 1;
  const sp = player.speed * (keys['Space'] ? 1.5 : 1);
  player.x += (dx / norm) * sp * dt;
  player.y += (dy / norm) * sp * dt;

  // clamp to canvas
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));

  // ----- fuel consumption -----
  fuel -= 5 * dt;
  if (fuel <= 0) status = 'lost';

  // ----- distance & score -----
  distance += sp * dt;
  score = Math.floor(distance / 10) + collectedFuel * 20;

  // ----- spawn new entities -----
  spawn(dt);

  // ----- update entities -----
  for (let i = entities.length - 1; i >= 0; i--) {
    const e = entities[i];
    e.y += e.vy * dt;

    const screen = { x: e.x, y: e.y, w: e.w, h: e.h };
    if (checkAABB(player, screen)) {
      if (e.type === 'obstacle') {
        status = 'lost';
        break;
      } else if (e.type === 'fuel') {
        fuel = Math.min(100, fuel + 30);
        collectedFuel++;
        entities.splice(i, 1);
        continue;
      }
    }

    // remove off‑screen entities
    if (e.y > canvas.height + 50) entities.splice(i, 1);
  }

  // ----- win condition -----
  if (distance >= 5000 && collectedFuel >= requiredFuel) status = 'won';

  // expose state for external tools
  window.__gameState = {
    player: { ...player },
    score,
    status,
    entities
  };
}
