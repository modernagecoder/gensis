<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Showdown</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        #gameCanvas {
            border: 1px solid #fff;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const keys = {};
        let player = {
            x: 400,
            y: 300,
            width: 40,
            height: 40,
            health: 100,
            speed: 200,
            vy: 0
        };
        let score = 0;
        let status = 'playing';
        let entities = [];
        let bullets = [];
        let enemies = [];
        let fireCooldown = 0;
        let spawnTimer = 0;
        let lastTime = performance.now();

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        canvas.addEventListener('click', () => window.focus());

        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            if (status === 'playing') {
                update(dt);
            }
            render();
            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            if (keys['ArrowLeft'] || keys['a']) {
                player.x -= player.speed * dt;
            }
            if (keys['ArrowRight'] || keys['d']) {
                player.x += player.speed * dt;
            }
            if (keys['ArrowUp'] || keys['w']) {
                player.vy = -player.speed;
            } else if (keys['ArrowDown'] || keys['s']) {
                player.vy = player.speed;
            } else {
                player.vy = 0;
            }
            player.y += player.vy * dt;
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            if (keys[' ']) {
                fireBullet();
            }

            spawnTimer += dt;
            if (spawnTimer > 0.8) {
                spawnTimer = 0;
                if (enemies.length < 30) {
                    enemies.push({
                        x: Math.random() * (canvas.width - 24),
                        y: -30,
                        width: 24,
                        height: 24,
                        vy: 120 + Math.random() * 100,
                        color: '#D8125B'
                    });
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.y += e.vy * dt;
                if (checkAABB(player, e)) {
                    player.health -= 25;
                    enemies.splice(i, 1);
                    if (player.health <= 0) {
                        status = 'lost';
                    }
                } else if (e.y > canvas.height + 50) {
                    enemies.splice(i, 1);
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y += b.vy * dt;
                if (b.y < -20) {
                    bullets.splice(i, 1);
                    continue;
                }
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (checkAABB(b, e)) {
                        bullets.splice(i, 1);
                        enemies.splice(j, 1);
                        score += 100;
                        break;
                    }
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.font = '24px Arial';
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`Score: ${score}`, 10, 10);
            ctx.fillText(`Health: ${player.health}`, 10, 40);
            ctx.fillText(status, canvas.width / 2 - 50, canvas.height / 2 - 20);
            for (const e of enemies) {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.width, e.height);
            }
            for (const b of bullets) {
                ctx.fillStyle = '#D8125B';
                ctx.fillRect(b.x, b.y, b.width, b.height);
            }
            window.__gameState = {
                player: {
                    x: player.x,
                    y: player.y,
                    width: player.width,
                    height: player.height,
                    health: player.health,
                    speed: player.speed
                },
                score: score,
                status: status,
                entities: entities
            };
        }

        function fireBullet() {
            if (fireCooldown <= 0) {
                fireCooldown = 0.18;
                bullets.push({
                    x: player.x + player.width / 2 - 3,
                    y: player.y - 6,
                    width: 6,
                    height: 12,
                    vy: -400,
                    color: '#D8125B'
                });
            }
        }

        function checkAABB(a, b) {
            return a.x < b.x + b.width &&
                a.x + a.width > b.x &&
                a.y < b.y + b.height &&
                a.y + a.height > b.y;
        }

        gameLoop(performance.now());
    </script>
</body>
</html>
