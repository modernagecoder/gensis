<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Showdown</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;
        let lastTime = performance.now();
        let player = {
            x: 100,
            y: canvas.height - 50,
            width: 50,
            height: 50,
            health: 100,
            speed: 5,
            vy: 0
        };
        let score = 0;
        let status = 'playing';
        let entities = [];
        let keys = {};

        window.__gameState = {
            player: {
                x: player.x,
                y: player.y,
                width: player.width,
                height: player.height,
                health: player.health,
                speed: player.speed
            },
            score: score,
            status: status,
            entities: entities
        };

        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            if (window.__gameState && window.__gameState.status === 'playing') {
                update(dt);
            }
            render();
            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            if (keys.ArrowLeft) {
                player.x -= player.speed * dt;
            }
            if (keys.ArrowRight) {
                player.x += player.speed * dt;
            }
            if (keys.ArrowUp) {
                player.vy = -10;
            } else {
                player.vy = 0;
            }
            player.y += player.vy * dt;
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

            spawnEntities(dt);
            updateEntities(dt);
            checkCollisions();
            updateScore();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.font = '24px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`Score: ${window.__gameState.score}`, 10, 10);
            ctx.fillText(`Health: ${window.__gameState.player.health}`, 10, 40);
            ctx.fillText(`Status: ${window.__gameState.status}`, 10, 70);
            for (let i = 0; i < entities.length; i++) {
                const e = entities[i];
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.width, e.height);
            }
            if (window.__gameState.status === 'lost') {
                ctx.fillStyle = 'white';
                ctx.font = '48px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Game Over!', canvas.width / 2, canvas.height / 2);
                ctx.font = '24px Arial';
                ctx.fillText('Press Space to restart', canvas.width / 2, canvas.height / 2 + 50);
            } else if (window.__gameState.status === 'won') {
                ctx.fillStyle = 'white';
                ctx.font = '48px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('You Won!', canvas.width / 2, canvas.height / 2);
                ctx.font = '24px Arial';
                ctx.fillText('Press Space to restart', canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        function spawnEntities(dt) {
            if (Math.random() < 0.05) {
                entities.push({
                    x: Math.random() * (canvas.width - 24),
                    y: -30,
                    width: 24,
                    height: 24,
                    vy: 120 + Math.random() * 100,
                    color: '#D8125B'
                });
            }
            if (Math.random() < 0.01) {
                entities.push({
                    x: Math.random() * (canvas.width - 20),
                    y: -20,
                    width: 20,
                    height: 20,
                    vy: 80 + Math.random() * 60,
                    color: '#F0C020'
                });
            }
        }

        function updateEntities(dt) {
            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                e.y += e.vy * dt;
                if (e.y > canvas.height + 50) {
                    entities.splice(i, 1);
                }
            }
        }

        function checkCollisions() {
            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                if (checkAABB(player, e)) {
                    if (e.color === '#F0C020') {
                        score++;
                        entities.splice(i, 1);
                    } else {
                        player.health -= 10;
                        entities.splice(i, 1);
                        if (player.health <= 0) {
                            status = 'lost';
                        }
                    }
                }
            }
        }

        function updateScore() {
            window.__gameState.score = score;
            window.__gameState.player.health = player.health;
            window.__gameState.status = status;
            window.__gameState.entities = entities;
        }

        function checkAABB(a, b) {
            return a.x < b.x + b.width &&
                a.x + a.width > b.x &&
                a.y < b.y + b.height &&
                a.y + a.height > b.y;
        }

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                if (window.__gameState.status === 'lost' || window.__gameState.status === 'won') {
                    status = 'playing';
                    player.health = 100;
                    score = 0;
                    entities = [];
                    window.__gameState = {
                        player: {
                            x: player.x,
                            y: player.y,
                            width: player.width,
                            height: player.height,
                            health: player.health,
                            speed: player.speed
                        },
                        score: score,
                        status: status,
                        entities: entities
                    };
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys
