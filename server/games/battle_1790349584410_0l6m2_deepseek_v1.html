<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Showdown</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
        }
        #gameCanvas {
            border: 1px solid #fff;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const keys = {};

        let player = {
            x: 400,
            y: 300,
            width: 50,
            height: 50,
            health: 100,
            speed: 5
        };

        let score = 0;
        let status = 'playing';
        let entities = [];

        window.__gameState = {
            player: {
                x: player.x,
                y: player.y,
                width: player.width,
                height: player.height,
                health: player.health,
                speed: player.speed
            },
            score: score,
            status: status,
            entities: entities
        };

        canvas.addEventListener('click', () => window.focus());

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            if (window.__gameState && window.__gameState.status === 'playing') {
                update(dt);
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        let lastTime = performance.now();
        requestAnimationFrame(gameLoop);

        function update(dt) {
            if (keys['ArrowLeft']) {
                player.x -= player.speed * dt;
            }
            if (keys['ArrowRight']) {
                player.x += player.speed * dt;
            }
            if (keys['ArrowUp']) {
                player.y -= player.speed * dt;
            }
            if (keys['ArrowDown']) {
                player.y += player.speed * dt;
            }

            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            spawnTimer += dt;
            if (spawnTimer > 0.8) {
                spawnTimer = 0;
                if (hazards.length < 30) {
                    hazards.push({
                        x: Math.random() * (canvas.width - 24),
                        y: -30,
                        width: 24,
                        height: 24,
                        vy: 120 + Math.random() * 100,
                        color: '#D8125B'
                    });
                }
                if (collectibles.length < 15 && Math.random() < 0.4) {
                    collectibles.push({
                        x: Math.random() * (canvas.width - 20),
                        y: -20,
                        width: 20,
                        height: 20,
                        vy: 80 + Math.random() * 60,
                        color: '#F0C020'
                    });
                }
            }

            for (let i = hazards.length - 1; i >= 0; i--) {
                const h = hazards[i];
                h.y += h.vy * dt;
                if (checkAABB(player, h)) {
                    player.health -= 25;
                    hazards.splice(i, 1);
                    if (player.health <= 0) {
                        status = 'lost';
                    }
                } else if (h.y > canvas.height + 50) {
                    hazards.splice(i, 1);
                }
            }

            for (let i = collectibles.length - 1; i >= 0; i--) {
                const c = collectibles[i];
                c.y += c.vy * dt;
                if (checkAABB(player, c)) {
                    score++;
                    collectibles.splice(i, 1);
                } else if (c.y > canvas.height + 50) {
                    collectibles.splice(i, 1);
                }
            }

            if (score >= 100) {
                status = 'won';
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = hazards.length - 1; i >= 0; i--) {
                const h = hazards[i];
                ctx.fillStyle = h.color;
                ctx.fillRect(h.x, h.y, h.width, h.height);
            }

            for (let i = collectibles.length - 1; i >= 0; i--) {
                const c = collectibles[i];
                ctx.fillStyle = c.color;
                ctx.fillRect(c.x, c.y, c.width, c.height);
            }

            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.font = '24px Arial';
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`Score: ${score}`, 10, 10);
            ctx.fillText(`Health: ${player.health}`, 10, 40);
            ctx.fillText(status, canvas.width / 2 - 50, canvas.height / 2);

            window.__gameState = {
                player: {
                    x: player.x,
                    y: player.y,
                    width: player.width,
                    height: player.height,
                    health: player.health,
                    speed: player.speed
                },
                score: score,
                status: status,
                entities: entities
            };
        }

        function checkAABB(a, b) {
            return a.x < b.x + b.width &&
                a.x + a.width > b.x &&
                a.y < b.y + b.height &&
                a.y + a.height > b.y;
        }

        let hazards = [];
        let collectibles = [];
        let spawnTimer = 0;
    </script>
</body>
</html>
