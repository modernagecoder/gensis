<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bullet Wave Blitz</title>
<style>
  body { margin:0; overflow:hidden; background:#000; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
/* -------------------------------------------------------------
   Core canvas and input setup
   ------------------------------------------------------------- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 600;

const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', e => {
  keys[e.key] = false;
  keys[e.key.toLowerCase()] = false;
});
canvas.addEventListener('click', () => window.focus());

/* -------------------------------------------------------------
   Game state definitions
   ------------------------------------------------------------- */
let player = { x:400, y:500, width:40, height:40, health:3, speed:300 };
let bullets = [];
let enemies = [];
let powerUps = [];
let obstacles = [];

let fireCooldown = 0;
let score = 0;
let wave = 1;
let spawnTimer = 0;
let spawnInterval = 2; // seconds
let gameStatus = 'playing';

/* expose a mutable debug object */
window.__gameState = {
  player: { x: player.x, y: player.y },
  score: 0,
  status: '',
  entities: []
};

/* -------------------------------------------------------------
   Helper functions
   ------------------------------------------------------------- */
function spawnEnemy() {
  enemies.push({
    x: Math.random() * (canvas.width - 40),
    y: -20,
    width: 40,
    height: 40,
    vy: 80 + wave * 10,
    health: 1
  });
}
function spawnPower() {
  powerUps.push({
    x: Math.random() * (canvas.width - 30),
    y: -20,
    width: 30,
    height: 30,
    vy: 60
  });
}
function spawnObstacle() {
  obstacles.push({
    x: Math.random() * (canvas.width - 60),
    y: -20,
    width: 60,
    height: 60,
    vy: 40
  });
}
function fireBullet() {
  if (fireCooldown > 0) return;
  fireCooldown = 0.2; // seconds between shots
  bullets.push({
    x: player.x + player.width / 2 - 5,
    y: player.y,
    width: 10,
    height: 20,
    vy: -500
  });
}

/* -------------------------------------------------------------
   Core update loop (fixed – previously truncated)
   ------------------------------------------------------------- */
function update(dt) {
  if (gameStatus !== 'playing') return;

  // player movement
  if (keys['ArrowUp'])    player.y -= player.speed * dt;
  if (keys['ArrowDown'])  player.y += player.speed * dt;
  if (keys['ArrowLeft'])  player.x -= player.speed * dt;
  if (keys['ArrowRight']) player.x += player.speed * dt;

  // keep player inside canvas
  player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

  // firing
  if (fireCooldown > 0) fireCooldown -= dt;
  if (keys[' '] || keys['Space']) fireBullet();

  // move bullets
  bullets.forEach(b => b.y += b.vy * dt);
  bullets = bullets.filter(b => b.y > -20);

  // move enemies
  enemies.forEach(e => e.y += e.vy * dt);
  enemies = enemies.filter(e => e.y < canvas.height + 20);

  // move power‑ups
  powerUps.forEach(p => p.y += p.vy * dt);
  powerUps = powerUps.filter(p => p.y < canvas.height + 20);

  // move obstacles
  obstacles.forEach(o => o.y += o.vy * dt);
  obstacles = obstacles.filter(o => o.y < canvas.height + 20);

  // spawn logic
  spawnTimer += dt;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    // simple wave progression
    if (Math.random() < 0.6) spawnEnemy();
    if (Math.random() < 0.1) spawnPower();
    if (Math.random() < 0.05) spawnObstacle();
  }

  // collision: bullets vs enemies
  bullets = bullets.filter(b => {
    let hit = false;
    enemies = enemies.filter(e => {
      const coll = !(b.x > e.x + e.width ||
                     b.x + b.width < e.x ||
                     b.y > e.y + e.height ||
                     b.y + b
