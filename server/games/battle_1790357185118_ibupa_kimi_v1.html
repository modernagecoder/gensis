<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Neon Astro Rush</title></head>
<body style="margin:0;background:#111;">
<canvas id="gameCanvas"></canvas>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=600;
const keys={};
window.addEventListener('keydown',e=>keys[e.key]=true);
window.addEventListener('keyup',e=>keys[e.key]=false);
canvas.addEventListener('click',()=>window.focus());
let player={x:canvas.width/2-15,y:canvas.height-60,w:30,h:30,spd:200,boost:0};
let status='playing',score=0,required=10,got=0;
const obstacles=[],collectibles=[];
const target={x:canvas.width/2-20,y:20,w:40,h:20};
let spawn=0,elapsed=0,boostTimer=0;
function rect(a,b){return a.x<b.x+a.w&&a.x+a.w>b.x&&a.y<b.y+a.h&&a.y+a.h>b.y;}
function update(dt){
  if(status==='playing'){
    if(keys.ArrowLeft)player.x-=player.spd*dt;
    if(keys.ArrowRight)player.x+=player.spd*dt;
    if(keys.ArrowUp)player.y-=player.spd*dt;
    if(keys.ArrowDown)player.y+=player.spd*dt;
    if(keys.Space&&!player.boost){player.boost=1;player.spd=400;boostTimer=0.5;}
    if(player.boost){boostTimer-=dt;if(boostTimer<=0){player.boost=0;player.spd=200;}}
    player.x=Math.max(0,Math.min(canvas.width-player.w,player.x));
    player.y=Math.max(0,Math.min(canvas.height-player.h,player.y));
    spawn+=dt;
    if(spawn>0.8){spawn=0;obstacles.push({x:Math.random()*(canvas.width-30),y:-30,w:30,h:30,vy:120+Math.random()*80});if(Math.random()<0.4)collectibles.push({x:Math.random()*(canvas.width-20),y:-20,w:20,h:20,vy:80+Math.random()*60});}
    for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];o.y+=o.vy*dt;if(rect(o,player)){status='lost';}else if(o.y>canvas.height){obstacles.splice(i,1);}}
    for(let i=collectibles.length-1;i>=0;i--){let c=collectibles[i];c.y+=c.vy*dt;if(rect(c,player)){got++;score+=100;collectibles.splice(i,1);}else if(c.y>canvas.height){collectibles.splice(i,1);}}
    if(player.y<=target.y+target.h&&got>=required)status='won';
    elapsed+=dt;
  }
  window.__gameState={player:{x:player.x,y:player.y,w:player.w,h:player.h,spd:player.spd},score, status, entities:{obstacles,collectibles,target}};
}
function render(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0f0';ctx.fillRect(target.x,target.y,target.w,target.h);
  ctx.fillStyle='#00f';ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillStyle='#f00';obstacles.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h));
  ctx.fillStyle='#ff0';collectibles.forEach(c=>ctx.fillRect(c.x,c.y,c.w,c.h));
  ctx.fillStyle='#fff';ctx.font='18px monospace';ctx.fillText('Score:'+score,10,20);
  ctx.fillText('Fuel:'+got+'/'+required,10,40);
  if(status!='playing'){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(status==='won'?'You Win!':'Game Over',canvas.width/2,canvas.height/2);
    ctx.fillText('Click to Restart',canvas.width/2,canvas.height/2+30);}
}
let last=performance.now();
function loop(now){let dt=Math.min((now-last)/1000,0.1);last=now;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
canvas.addEventListener('click',()=>{if(status!='playing'){player={x:canvas.width/2-15,y:canvas.height-60,w:30,h:30,spd:200,boost:0};status='playing';score=0;got=0;obstacles.length=0;collectibles.length=0;elapsed=0;boostTimer=0;}})
</script>
</body>
</html>
