<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Arena Showdown</title>
  <style>
    #gameCanvas {
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const keys = {};

    let player = {
      x: 400,
      y: 300,
      width: 24,
      height: 24,
      vy: 0,
      vx: 0,
      health: 100,
      speed: 200,
      color: '#F0C020'
    };

    let score = 0;
    let status = 'playing';
    let entities = [];

    window.__gameState = {
      player: {
        x: player.x,
        y: player.y,
        width: player.width,
        height: player.height,
        health: player.health,
        speed: player.speed
      },
      score: score,
      status: status,
      entities: entities
    };

    canvas.addEventListener('click', () => window.focus());

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === 'ArrowLeft') player.vx = -player.speed;
      if (e.key === 'ArrowRight') player.vx = player.speed;
      if (e.key === 'ArrowUp') player.vy = -player.speed;
      if (e.key === 'ArrowDown') player.vy = player.speed;
      if (e.key === 'w') player.vx = -player.speed;
      if (e.key === 's') player.vx = player.speed;
      if (e.key === 'a') player.vy = -player.speed;
      if (e.key === 'd') player.vy = player.speed;
      if (e.key === ' ') {
        player.vy = -player.speed;
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'w' || e.key === 's') player.vx = 0;
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'a' || e.key === 'd') player.vy = 0;
      if (e.key === ' ') player.vy = 0;
    });

    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      if (window.__gameState && window.__gameState.status === 'playing') {
        update(dt);
      }
      render();
      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    function update(dt) {
      player.x += player.vx * dt;
      player.y += player.vy * dt;

      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

      spawnTimer += dt;
      if (spawnTimer > 0.8) {
        spawnTimer = 0;
        if (hazards.length < 30) {
          hazards.push({
            x: Math.random() * (canvas.width - 24),
            y: -30,
            width: 24,
            height: 24,
            vy: 120 + Math.random() * 100,
            color: '#D8125B'
          });
        }
        if (collectibles.length < 15 && Math.random() < 0.4) {
          collectibles.push({
            x: Math.random() * (canvas.width - 20),
            y: -20,
            width: 20,
            height: 20,
            vy: 80 + Math.random() * 60,
            color: '#F0C020'
          });
        }
      }

      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.y += h.vy * dt;
        if (checkAABB(player, h)) {
          player.health -= 25;
          hazards.splice(i, 1);
          if (player.health <= 0) status = 'lost';
        } else if (h.y > canvas.height + 50) {
          hazards.splice(i, 1);
        }
      }

      for (let i = collectibles.length - 1; i >= 0; i--) {
        const c = collectibles[i];
        c.y += c.vy * dt;
        if (checkAABB(player, c)) {
          score++;
          collectibles.splice(i, 1);
        } else if (c.y > canvas.height + 50) {
          collectibles.splice(i, 1);
        }
      }

      if (score >= 100) status = 'won';
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);

      for (const h of hazards) {
        ctx.fillStyle = h.color;
        ctx.fillRect(h.x, h.y, h.width, h.height);
      }

      for (const c of collectibles) {
        ctx.fillStyle = c.color;
        ctx.fillRect(c.x, c.y, c.width, c.height);
      }

      ctx.font = '24px Arial';
      ctx.fillStyle = 'white';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText('Score: ' + score, 10, 10);
      ctx.fillText('Health: ' + player.health, 10, 40);
      ctx.fillText('Status: ' + status, 10, 70);

      window.__gameState = {
        player: {
          x: player.x,
          y: player.y,
          width: player.width,
          height: player.height,
          health: player.health,
          speed: player.speed
        },
        score: score,
        status: status,
        entities: entities
      };
    }

    function checkAABB(a, b) {
      return a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y;
    }

    let hazards = [];
    let collectibles = [];
    let spawnTimer = 0;
  </script>
</body>
</html>
