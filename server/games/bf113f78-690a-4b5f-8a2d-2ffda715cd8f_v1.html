<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Pill Rush</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      background: #222;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      border: 4px solid #444;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const TILE_SIZE = 20;
const COLS = canvas.width / TILE_SIZE;
const ROWS = canvas.height / TILE_SIZE;

// Game state variables
let score = 0;
let status = 'playing'; // 'playing' | 'lost'
let moveTimer = 0;
const moveInterval = 0.1; // speed of snake

let snake = [];
let dir = { x: 1, y: 0 };
let nextDir = { x: 1, y: 0 };
let pill = { x: 0, y: 0, color: '#f0c020' };

// Global game state object required by spec
window.__gameState = {
  player: { x: 0, y: 0, width: TILE_SIZE, height: TILE_SIZE, health: 100, speed: TILE_SIZE },
  score: 0,
  status: 'playing',
  entities: []
};

// Input handling
const keys = {};
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'w', 'a', 's', 'd'].includes(e.key)) {
    e.preventDefault();
  }
  keys[e.key] = true;
  keys[e.key.toLowerCase()] = true;

  if (status === 'lost' && (e.key === 'r' || e.key === 'R' || e.key === 'Enter')) {
    resetGame();
  }

  // Direction changes
  if ((e.key === 'ArrowUp' || e.key === 'w') && dir.y === 0) {
    nextDir = { x: 0, y: -1 };
  }
  if ((e.key === 'ArrowDown' || e.key === 's') && dir.y === 0) {
    nextDir = { x: 0, y: 1 };
  }
  if ((e.key === 'ArrowLeft' || e.key === 'a') && dir.x === 0) {
    nextDir = { x: -1, y: 0 };
  }
  if ((e.key === 'ArrowRight' || e.key === 'd') && dir.x === 0) {
    nextDir = { x: 1, y: 0 };
  }
});

window.addEventListener('keyup', (e) => {
  keys[e.key] = false;
  keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener('click', () => window.focus());

function spawnPill() {
  while (true) {
    let rx = Math.floor(Math.random() * COLS);
    let ry = Math.floor(Math.random() * ROWS);
    let collision = snake.some(seg => seg.x === rx && seg.y === ry);
    if (!collision) {
      pill = { x: rx, y: ry, color: '#f0c020' };
      break;
    }
  }
}

function resetGame() {
  score = 0;
  status = 'playing';
  snake = [
    { x: 10, y: 15 },
    { x: 9, y: 15 },
    { x: 8, y: 15 }
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  moveTimer = 0;
  spawnPill();
}

resetGame();

function update(dt) {
  if (status !== 'playing') return;

  moveTimer += dt;
  if (moveTimer >= moveInterval) {
    moveTimer = 0;
    dir = nextDir;

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      status = 'lost';
    }

    // Self collision
    if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
      status = 'lost';
    }

    if (status === 'lost') {
      window.__gameState.status = 'lost';
      return;
    }

    snake.unshift(head);

    // Eat pill
    if (head.x === pill.x && head.y === pill.y) {
      score += 10;
      spawnPill();
    } else {
      snake.pop();
    }
  }

  // Update __gameState
  window.__gameState.score = score;
  window.__gameState.status = status;
  window.__gameState.player = {
    x: snake[0].x * TILE_SIZE,
    y: snake[0].y * TILE_SIZE,
    width: TILE_SIZE,
    height: TILE_SIZE,
    health: status === 'playing' ? 100 : 0,
    speed: TILE_SIZE
  };
  window.__gameState.entities = [
    { x: pill.x * TILE_SIZE, y: pill.y * TILE_SIZE, type: 'pill' },
    ...snake.map(s => ({ x: s.x * TILE_SIZE, y: s.y * TILE_SIZE, type: 'snake' }))
  ];
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw grid lines (subtle)
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 1;
  for (let i = 0; i < COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * TILE_SIZE, 0);
    ctx.lineTo(i * TILE_SIZE, canvas.height);
    ctx.stroke();
  }
  for (let j = 0; j < ROWS; j++) {
    ctx.beginPath();
    ctx.moveTo(0, j * TILE_SIZE);
    ctx.lineTo(canvas.width, j * TILE_SIZE);
    ctx.stroke();
  }

  // Draw Pill
  ctx.fillStyle = pill.color;
  ctx.beginPath();
  ctx.arc((pill.x + 0.5) * TILE_SIZE, (pill.y + 0.5) * TILE_SIZE, TILE_SIZE / 2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // Draw Snake
  snake.forEach((seg, index) => {
    ctx.fillStyle = index === 0 ? '#4CAF50' : '#8BC34A';
    ctx.fillRect(seg.x * TILE_SIZE + 1, seg.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
  });

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '20px sans-serif';
  ctx.fillText(`Score: ${score}`, 20, 35);

  if (status === 'lost') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff5252';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);

    ctx.fillStyle = '#fff';
    ctx.font = '20px sans-serif';
    ctx.fillText('Press R or Enter to Restart', canvas.width / 2, canvas.height / 2 + 30);
    ctx.textAlign = 'left';
  }
}

let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>


<script>
(function () {
  if (window.__gaBridge) return;
  window.__gaBridge = true;
  window.__pressed = window.__pressed || {};
  function setKey(e, on) {
    if (!e) return;
    window.__pressed[e.key] = on;
    window.__pressed[e.code] = on;
    if (e.key) window.__pressed[e.key.toLowerCase()] = on;
  }
  window.addEventListener('keydown', function (e) {
    setKey(e, true);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }, true);
  window.addEventListener('keyup', function (e) { setKey(e, false); }, true);
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type !== 'KEY_EVENT') return;
    var fake = { key: d.key, code: d.code, keyCode: d.keyCode };
    setKey(fake, d.eventType !== 'keyup');
    try {
      var ke = new KeyboardEvent(d.eventType || 'keydown', {
        key: d.key, code: d.code, bubbles: true, cancelable: true
      });
      window.dispatchEvent(ke);
      document.dispatchEvent(ke);
    } catch (err) {}
  });
  var canvas = document.querySelector('canvas');
  if (canvas) {
    canvas.setAttribute('tabindex', '0');
    canvas.addEventListener('click', function () { canvas.focus(); });
  }
})();
</script>
</body>
</html>
