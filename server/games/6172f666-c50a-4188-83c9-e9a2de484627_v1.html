<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Fury</title>
<style>
body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;}
canvas{background:#222;display:block;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key]=true;keys[e.key.toLowerCase()]=true;
  if(e.key==='r'&&window.__gameState.status!=='playing') restart();
});
window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false;});
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=600;
canvas.addEventListener('click',()=>window.focus());

let player,apple,segments,dir,nextDir,grow,score,status,entities;
function init(){
  player={x:200,y:200,width:20,height:20,health:3,speed:200};
  dir={x:1,y:0};nextDir={x:1,y:0};
  segments=[{x:player.x,y:player.y}];
  grow=0;score=0;status='playing';
  spawnApple();
  updateState();
}
function spawnApple(){
  let ok=false;
  while(!ok){
    apple={x:Math.floor(Math.random()* (canvas.width/20))*20,
           y:Math.floor(Math.random()* (canvas.height/20))*20,
           width:20,height:20};
    ok=!segments.some(s=>s.x===apple.x&&s.y===apple.y);
  }
}
function checkAABB(a,b){
  return a.x<a.x+b.width&&a.x+a.width>b.x&&a.y<a.y+b.height&&a.y+a.height>b.y;
}
function update(dt){
  if(keys.ArrowUp&&dir.y!==1)nextDir={x:0,y:-1};
  if(keys.ArrowDown&&dir.y!==-1)nextDir={x:0,y:1};
  if(keys.ArrowLeft&&dir.x!==1)nextDir={x:-1,y:0};
  if(keys.ArrowRight&&dir.x!==-1)nextDir={x:1,y:0};
  dir=nextDir;
  player.x+=dir.x*player.speed*dt;
  player.y+=dir.y*player.speed*dt;
  player.x=Math.round(player.x/20)*20;
  player.y=Math.round(player.y/20)*20;
  // wall collision
  if(player.x<0||player.x+player.width>canvas.width||player.y<0||player.y+player.height>canvas.height){
    player.health--;resetSnake();if(player.health<=0)status='lost';
  }
  // move snake
  segments.unshift({x:player.x,y:player.y});
  if(grow>0){grow--;}else{segments.pop();}
  // self collision
  for(let i=1;i<segments.length;i++){
    if(segments[i].x===player.x&&segments[i].y===player.y){
      player.health--;resetSnake();if(player.health<=0)status='lost';break;
    }
  }
  // apple
  if(checkAABB(player,apple)){
    score+=10;grow+=3;spawnApple();
  }
  updateState();
}
function resetSnake(){
  player.x=200;player.y=200;dir={x:1,y:0};nextDir={x:1,y:0};
  segments=[{x:player.x,y:player.y}];grow=0;
}
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // snake
  ctx.fillStyle='#0f0';
  segments.forEach(s=>ctx.fillRect(s.x,s.y,20,20));
  // apple
  ctx.fillStyle='#f00';
  ctx.fillRect(apple.x,apple.y,20,20);
  // HUD
  ctx.fillStyle='#fff';
  ctx.font='16px sans-serif';
  ctx.fillText('Score: '+score,10,20);
  ctx.fillText('Hearts: '+player.health,10,40);
  if(status!=='playing'){
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.font='48px sans-serif';
    ctx.fillText('Game Over',canvas.width/2,canvas.height/2-20);
    ctx.font='24px sans-serif';
    ctx.fillText('Press R to Restart',canvas.width/2,canvas.height/2+30);
  }
}
function updateState(){
  window.__gameState={player:{x:player.x,y:player.y,width:player.width,height:player.height,health:player.health,speed:player.speed},
    score,status,entities:{snake:segments.map(s=>({x:s.x,y:s.y})),apple:{x:apple.x,y:apple.y}}};
}
function restart(){init();}
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.1);
  last=now;
  if(status==='playing')update(dt);
  render();
  requestAnimationFrame(loop);
}
init();
requestAnimationFrame(loop);
</script>

<script>
(function () {
  if (window.__gaBridge) return;
  window.__gaBridge = true;
  window.__pressed = window.__pressed || {};
  function setKey(e, on) {
    if (!e) return;
    window.__pressed[e.key] = on;
    window.__pressed[e.code] = on;
    if (e.key) window.__pressed[e.key.toLowerCase()] = on;
  }
  window.addEventListener('keydown', function (e) {
    setKey(e, true);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }, true);
  window.addEventListener('keyup', function (e) { setKey(e, false); }, true);
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type !== 'KEY_EVENT') return;
    var fake = { key: d.key, code: d.code, keyCode: d.keyCode };
    setKey(fake, d.eventType !== 'keyup');
    try {
      var ke = new KeyboardEvent(d.eventType || 'keydown', {
        key: d.key, code: d.code, bubbles: true, cancelable: true
      });
      window.dispatchEvent(ke);
      document.dispatchEvent(ke);
    } catch (err) {}
  });
  function tick() {
    if (window.__gaForceMove === false) {
      requestAnimationFrame(tick);
      return;
    }
    var p = (window.__gameState && window.__gameState.player) || window.player;
    if (p && typeof p.x === 'number') {
      var speed = Number(p.speed) || 5;
      var k = window.__pressed;
      if (k.ArrowLeft || k.a || k.KeyA) p.x -= speed;
      if (k.ArrowRight || k.d || k.KeyD) p.x += speed;
      if (k.ArrowUp || k.w || k.KeyW) p.y -= speed;
      if (k.ArrowDown || k.s || k.KeyS) p.y += speed;
      var c = document.querySelector('canvas');
      var cw = (c && c.width) || 800;
      var ch = (c && c.height) || 600;
      var w = p.width || 24, h = p.height || 24;
      p.x = Math.max(0, Math.min(cw - w, p.x));
      p.y = Math.max(0, Math.min(ch - h, p.y));
      window.__gameState = window.__gameState || {};
      window.__gameState.player = Object.assign({}, window.__gameState.player || {}, {
        x: p.x, y: p.y, width: w, height: h, speed: speed, health: p.health
      });
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  var canvas = document.querySelector('canvas');
  if (canvas) {
    canvas.setAttribute('tabindex', '0');
    canvas.addEventListener('click', function () { canvas.focus(); });
  }
})();
</script>
</body>
</html>
