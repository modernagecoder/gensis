<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube Hopper</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
      color: #fff;
    }
    canvas {
      background: #222;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      display: block;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Input state
  const keys = {};
  window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    keys[e.key] = true;
    keys[e.key.toLowerCase()] = true;

    if ((e.key === 'r' || e.key === 'R' || e.key === 'Enter') && window.__gameState.status !== 'playing') {
      resetGame();
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
    keys[e.key.toLowerCase()] = false;
  });
  canvas.addEventListener('click', () => window.focus());
  window.focus();

  // Game configuration & variables
  const GRAVITY = 1200;
  const JUMP_FORCE = -500;
  const MOVE_SPEED = 350;

  let score = 0;
  let totalCoins = 0;

  let player = {
    x: 50,
    y: 400,
    width: 30,
    height: 30,
    vx: 0,
    vy: 0,
    health: 3,
    speed: MOVE_SPEED,
    onGround: false
  };

  let platforms = [];
  let coins = [];
  let spikes = [];

  // Global state required by prompt
  window.__gameState = {
    player: { x: player.x, y: player.y, width: player.width, height: player.height, health: player.health, speed: player.speed },
    score: score,
    status: 'playing',
    entities: []
  };

  function initLevel() {
    platforms = [
      { x: 0, y: 550, width: 800, height: 50 }, // Ground
      { x: 200, y: 440, width: 150, height: 20 },
      { x: 450, y: 350, width: 150, height: 20 },
      { x: 150, y: 260, width: 150, height: 20 },
      { x: 400, y: 170, width: 180, height: 20 },
      { x: 100, y: 100, width: 100, height: 20 }
    ];

    coins = [
      { x: 260, y: 400, width: 20, height: 20, collected: false },
      { x: 500, y: 310, width: 20, height: 20, collected: false },
      { x: 200, y: 220, width: 20, height: 20, collected: false },
      { x: 480, y: 130, width: 20, height: 20, collected: false },
      { x: 140, y: 60, width: 20, height: 20, collected: false }
    ];
    totalCoins = coins.length;

    spikes = [
      { x: 350, y: 530, width: 30, height: 20 },
      { x: 550, y: 530, width: 30, height: 20 },
      { x: 220, y: 420, width: 26, height: 20 },
      { x: 430, y: 150, width: 26, height: 20 }
    ];
  }

  function resetGame() {
    player.x = 50;
    player.y = 400;
    player.vx = 0;
    player.vy = 0;
    player.health = 3;
    score = 0;
    window.__gameState.status = 'playing';
    initLevel();
  }

  initLevel();

  function update(dt) {
    if (window.__gameState.status !== 'playing') return;

    // Horizontal movement
    let moveDir = 0;
    if (keys['ArrowLeft'] || keys['a'] || (window.__pressed && (window.__pressed['ArrowLeft'] || window.__pressed['a']))) moveDir = -1;
    if (keys['ArrowRight'] || keys['d'] || (window.__pressed && (window.__pressed['ArrowRight'] || window.__pressed['d']))) moveDir = 1;

    player.vx = moveDir * player.speed;
    player.x += player.vx * dt;

    // Clamp player X
    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

    // Vertical movement & gravity
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;

    // Jump
    if ((keys['ArrowUp'] || keys['w'] || keys[' '] || (window.__pressed && (window.__pressed['ArrowUp'] || window.__pressed['w'] || window.__pressed[' ']))) && player.onGround) {
      player.vy = JUMP_FORCE;
      player.onGround = false;
    }

    // Platform collisions
    player.onGround = false;
    for (let p of platforms) {
      if (
        player.x < p.x + p.width &&
        player.x + player.width > p.x &&
        player.y + player.height > p.y &&
        player.y + player.height - player.vy * dt <= p.y + 5
      ) {
        if (player.vy > 0) {
          player.y = p.y - player.height;
          player.vy = 0;
          player.onGround = true;
        }
      }
    }

    // Coin collection
    for (let c of coins) {
      if (!c.collected &&
        player.x < c.x + c.width &&
        player.x + player.width > c.x &&
        player.y < c.y + c.height &&
        player.y + player.height > c.y
      ) {
        c.collected = true;
        score += 100;
      }
    }

    // Spike collision
    for (let s of spikes) {
      if (
        player.x < s.x + s.width &&
        player.x + player.width > s.x &&
        player.y < s.y + s.height &&
        player.y + player.height > s.y
      ) {
        player.health--;
        player.y -= 40;
        player.vy = -300;
        if (player.health <= 0) {
          window.__gameState.status = 'lost';
        }
        break;
      }
    }

    // Fall off screen
    if (player.y > canvas.height) {
      window.__gameState.status = 'lost';
    }

    const activeCoins = coins.filter(c => !c.collected).length;
    if (activeCoins === 0) {
      window.__gameState.status = 'won';
    }

    window.__gameState.player = { x: player.x, y: player.y, width: player.width, height: player.height, health: player.health, speed: player.speed };
    window.__gameState.score = score;
    window.__gameState.entities = [
      ...platforms.map(p => ({ type: 'platform', ...p })),
      ...coins.filter(c => !c.collected).map(c => ({ type: 'coin', ...c })),
      ...spikes.map(s => ({ type: 'spike', ...s }))
    ];
  }

  function render() {
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#4a5568';
    for (let p of platforms) {
      ctx.fillRect(p.x, p.y, p.width, p.height);
      ctx.fillStyle = '#2d3748';
      ctx.fillRect(p.x, p.y + p.height - 4, p.width, 4);
      ctx.fillStyle = '#4a5568';
    }

    ctx.fillStyle = '#e53e3e';
    for (let s of spikes) {
      ctx.beginPath();
      ctx.moveTo(s.x, s.y + s.height);
      ctx.lineTo(s.x + s.width / 2, s.y);
      ctx.lineTo(s.x + s.width, s.y + s.height);
      ctx.closePath();
      ctx.fill();
    }

    for (let c of coins) {
      if (!c.collected) {
        ctx.fillStyle = '#ecc94b';
        ctx.beginPath();
        ctx.arc(c.x + c.width / 2, c.y + c.height / 2, c.width / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#d69e2e';
        ctx.stroke();
      }
    }

    ctx.fillStyle = '#3182ce';
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.fillStyle = '#63b3ed';
    ctx.fillRect(player.x + player.width - 10, player.y + 6, 6, 6);

    ctx.fillStyle = '#fff';
    ctx.font = '20px sans-serif';
    ctx.fillText(`Score: ${score}`, 20, 35);
    ctx.fillText(`Health: ${'♥ '.repeat(player.health)}`, 20, 65);
    const remaining = coins.filter(c => !c.collected).length;
    ctx.fillText(`Coins Left: ${remaining}`, canvas.width - 170, 35);

    if (window.__gameState.status === 'won') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#48bb78';
      ctx.font = 'bold 48px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('VICTORY!', canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = '20px sans-serif';
      ctx.fillText('Press R or Enter to Restart', canvas.width / 2, canvas.height / 2 + 30);
      ctx.textAlign = 'left';
    } else if (window.__gameState.status === 'lost') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f56565';
      ctx.font = 'bold 48px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = '#fff';
      ctx.font = '20px sans-serif';
      ctx.fillText('Press R or Enter to Restart', canvas.width / 2, canvas.height / 2 + 30);
      ctx.textAlign = 'left';
    }
  }

  let lastTime = performance.now();
  function gameLoop(now) {
    if (!now) now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
  }
  requestAnimationFrame(gameLoop);

</script>

<script>
(function () {
  if (window.__gaBridge) return;
  window.__gaBridge = true;
  window.__pressed = window.__pressed || {};
  function setKey(e, on) {
    if (!e) return;
    window.__pressed[e.key] = on;
    window.__pressed[e.code] = on;
    if (e.key) window.__pressed[e.key.toLowerCase()] = on;
  }
  window.addEventListener('keydown', function (e) {
    setKey(e, true);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }, true);
  window.addEventListener('keyup', function (e) { setKey(e, false); }, true);
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type !== 'KEY_EVENT') return;
    var fake = { key: d.key, code: d.code, keyCode: d.keyCode };
    setKey(fake, d.eventType !== 'keyup');
    try {
      var ke = new KeyboardEvent(d.eventType || 'keydown', {
        key: d.key, code: d.code, bubbles: true, cancelable: true
      });
      window.dispatchEvent(ke);
      document.dispatchEvent(ke);
    } catch (err) {}
  });
  var canvas = document.querySelector('canvas');
  if (canvas) {
    canvas.setAttribute('tabindex', '0');
    canvas.addEventListener('click', function () { canvas.focus(); });
  }
})();
</script>
</body>
</html>
