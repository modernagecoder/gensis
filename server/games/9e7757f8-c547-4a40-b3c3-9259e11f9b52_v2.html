<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Triangle Dash</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;overflow:hidden}
#gameCanvas{display:block;background:#000}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
canvas.width=800;canvas.height=600;
const keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  keys[e.key]=true;keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{
  keys[e.key]=false;keys[e.key.toLowerCase()]=false;
});
canvas.addEventListener('click',()=>window.focus());

let player={x:380,y:500,w:30,h:30,health:100,speed:200,dashTimer:0};
let score=0, status='playing', entities=[], spawnTimer=0;
window.__gameState={player:null,score:0,status:'playing',entities:[]};

function reset(){
  player={x:380,y:500,w:30,h:30,health:100,speed:200,dashTimer:0};
  score=0;status='playing';entities=[];spawnTimer=0;
}
function checkAABB(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

  // movement
  let sp=player.speed;
  if(keys[' ']&&player.dashTimer<=0){player.dashTimer=0.3;sp*=2.5;}
  if(player.dashTimer>0){player.dashTimer-=dt;}
  if(keys['ArrowLeft'])player.x-=sp*dt;
  if(keys['ArrowRight'])player.x+=sp*dt;
  if(keys['ArrowUp'])player.y-=sp*dt;
  if(keys['ArrowDown'])player.y+=sp*dt;
  player.x=Math.max(0,Math.min(canvas.width-player.w,player.x));
  player.y=Math.max(0,Math.min(canvas.height-player.h,player.y));
