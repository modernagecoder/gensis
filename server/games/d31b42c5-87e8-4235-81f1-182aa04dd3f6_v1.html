<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Astro Blaster</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #05050d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.3), 0 0 10px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #1a2638;
    }
    canvas {
      display: block;
      background: #020208;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
  </div>

  <script>
    // Audio synthesizer using Web Audio API
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;

        if (type === 'laser') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(800, t);
          osc.frequency.exponentialRampToValueAtTime(150, t + 0.12);
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
          osc.start(t);
          osc.stop(t + 0.12);
        } else if (type === 'hit') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, t);
          osc.frequency.linearRampToValueAtTime(40, t + 0.2);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.2);
          osc.start(t);
          osc.stop(t + 0.2);
        } else if (type === 'explosion') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.exponentialRampToValueAtTime(25, t + 0.35);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.35);
          osc.start(t);
          osc.stop(t + 0.35);
        } else if (type === 'win') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, t);
          osc.frequency.setValueAtTime(554.37, t + 0.1);
          osc.frequency.setValueAtTime(659.25, t + 0.2);
          osc.frequency.setValueAtTime(880, t + 0.3);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.linearRampToValueAtTime(0.01, t + 0.6);
          osc.start(t);
          osc.stop(t + 0.6);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const keys = {};
    window.addEventListener('keydown', (e) => {
      initAudio();
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
        e.preventDefault();
      }
      keys[e.key] = true;
      keys[e.key.toLowerCase()] = true;

      if ((e.key === 'r' || e.key === 'R' || e.key === 'Enter') && 
          (window.__gameState.status === 'won' || window.__gameState.status === 'lost')) {
        resetGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
      keys[e.key.toLowerCase()] = false;
    });

    canvas.addEventListener('click', () => {
      window.focus();
      initAudio();
    });

    // Starfield Background
    const stars = [];
    for (let i = 0; i < 100; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 40 + 15,
        brightness: Math.random() * 0.7 + 0.3
      });
    }

    // Game Entities & State
    let player;
    let bullets = [];
    let asteroids = [];
    let particles = [];
    let score = 0;
    let asteroidsDestroyed = 0;
    let elapsedTime = 0;
    let spawnTimer = 0;
    let shootCooldown = 0;
    let invulnerableTimer = 0;
    const WIN_TIME = 180; // 3 minutes
    const WIN_KILLS = 100;

    function resetGame() {
      player = {
        x: canvas.width / 2 - 20,
        y: canvas.height - 65,
        width: 40,
        height: 48,
        health: 3,
        speed: 360
      };
      bullets = [];
      asteroids = [];
      particles = [];
      score = 0;
      asteroidsDestroyed = 0;
      elapsedTime = 0;
      spawnTimer = 0;
      shootCooldown = 0;
      invulnerableTimer = 1.5;

      window.__gameState = {
        player: { ...player },
        score: score,
        status: 'playing',
        entities: []
      };
    }

    function createExplosion(x, y, color, count = 16) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 140 + 30;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3 + 2,
          color: color,
          alpha: 1,
          life: Math.random() * 0.4 + 0.3
        });
      }
    }

    function spawnAsteroid() {
      if (asteroids.length >= 25) return;
      const radius = Math.floor(Math.random() * 18) + 16;
      const x = Math.random() * (canvas.width - radius * 2) + radius;
      const speedY = Math.random() * 90 + 75 + Math.min(asteroidsDestroyed * 0.7, 90);
      const speedX = (Math.random() - 0.5) * 60;
      
      // Generate jagged polygon points
      const points = [];
      const numPoints = 8;
      for (let i = 0; i < numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        const variance = (Math.random() * 0.4 + 0.8);
        points.push({
          x: Math.cos(angle) * radius * variance,
          y: Math.sin(angle) * radius * variance
        });
      }

      asteroids.push({
        x: x,
        y: -radius - 10,
        radius: radius,
        vx: speedX,
        vy: speedY,
        rot: 0,
        rotSpeed: (Math.random() - 0.5) * 2.5,
        points: points,
        hp: radius > 26 ? 2 : 1
      });
    }

    resetGame();

    // Game Update Loop
    function update(dt) {
      elapsedTime += dt;
      shootCooldown -= dt;
      if (invulnerableTimer > 0) invulnerableTimer -= dt;

      // Check Win condition
      if (asteroidsDestroyed >= WIN_KILLS || elapsedTime >= WIN_TIME) {
        window.__gameState.status = 'won';
        playSound('win');
        return;
      }

      // Continuous Asteroid Spawning
      spawnTimer += dt;
      const currentSpawnRate = Math.max(0.45, 1.25 - (asteroidsDestroyed * 0.008));
      if (spawnTimer >= currentSpawnRate) {
        spawnTimer = 0;
        spawnAsteroid();
      }

      // Input Movement
      if (keys['arrowleft'] || keys['a']) {
        player.x -= player.speed * dt;
      }
      if (keys['arrowright'] || keys['d']) {
        player.x += player.speed * dt;
      }
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

      // Player Shooting
      if (keys[' '] && shootCooldown <= 0) {
        bullets.push({
          x: player.x + player.width / 2 - 2.5,
          y: player.y - 4,
          width: 5,
          height: 14,
          vy: -550
        });
        playSound('laser');
        shootCooldown = 0.18; // Max ~5.5 shots per second
      }

      // Update Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy * dt;
        if (b.y < -20) {
          bullets.splice(i, 1);
        }
      }

      // Update Asteroids
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const ast = asteroids[i];
        ast.x += ast.vx * dt;
        ast.y += ast.vy * dt;
        ast.rot += ast.rotSpeed * dt;

        // Bounce off canvas side borders gently
        if (ast.x - ast.radius < 0) {
          ast.x = ast.radius;
          ast.vx = Math.abs(ast.vx);
        } else if (ast.x + ast.radius > canvas.width) {
          ast.x = canvas.width - ast.radius;
          ast.vx = -Math.abs(ast.vx);
        }

        // Out of bottom bounds
        if (ast.y - ast.radius > canvas.height + 20) {
          asteroids.splice(i, 1);
          continue;
        }

        // Asteroid vs Bullets
        let destroyed = false;
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const distX = (ast.x) - (b.x + b.width / 2);
          const distY = (ast.y) - (b.y + b.height / 2);
          if (distX * distX + distY * distY <= ast.radius * ast.radius) {
            bullets.splice(j, 1);
            ast.hp--;
            createExplosion(b.x + b.width / 2, b.y, '#ffaa33', 6);

            if (ast.hp <= 0) {
              playSound('explosion');
              createExplosion(ast.x, ast.y, '#9c8d84', 16);
              createExplosion(ast.x, ast.y, '#ff6622', 10);
              score += 100;
              asteroidsDestroyed++;
              asteroids.splice(i, 1);
              destroyed = true;
              break;
            } else {
              playSound('hit');
            }
          }
        }
        if (destroyed) continue;

        // Asteroid vs Player Collision
        if (invulnerableTimer <= 0) {
          const pCenterX = player.x + player.width / 2;
          const pCenterY = player.y + player.height / 2;
          const pRadius = 18;
          const distSq = (ast.x - pCenterX) * (ast.x - pCenterX) + (ast.y - pCenterY) * (ast.y - pCenterY);
          const radSum = ast.radius + pRadius;

          if (distSq <= radSum * radSum) {
            player.health -= 1;
            invulnerableTimer = 1.8;
            playSound('hit');
            createExplosion(pCenterX, pCenterY, '#ff2222', 20);
            asteroids.splice(i, 1);

            if (player.health <= 0) {
              player.health = 0;
              window.__gameState.status = 'lost';
              playSound('explosion');
              return;
            }
          }
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha -= dt / p.life;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      // Starfield parallax
      for (const s of stars) {
        s.y += s.speed * dt;
        if (s.y > canvas.height) {
          s.y = 0;
          s.x = Math.random() * canvas.width;
        }
      }

      // Sync window.__gameState for test assertions
      window.__gameState.player = {
        x: player.x,
        y: player.y,
        width: player.width,
        height: player.height,
        health: player.health,
        speed: player.speed
      };
      window.__gameState.score = score;
      
      const flatEntities = [];
      for (const a of asteroids) flatEntities.push({ x: a.x, y: a.y, type: 'asteroid', radius: a.radius });
      for (const b of bullets) flatEntities.push({ x: b.x, y: b.y, type: 'bullet' });
      window.__gameState.entities = flatEntities;
    }

    // Render Canvas
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Starfield
      for (const s of stars) {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.brightness})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }

      // 2. Draw Bullets
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00ffff';
      ctx.fillStyle = '#66ffff';
      for (const b of bullets) {
        ctx.fillRect(b.x, b.y, b.width, b.height);
      }
      ctx.shadowBlur = 0;

      // 3. Draw Asteroids
      for (const ast of asteroids) {
        ctx.save();
        ctx.translate(ast.x, ast.y);
        ctx.rotate(ast.rot);

        ctx.fillStyle = '#655750';
        ctx.strokeStyle = '#9c8c82';
        ctx.lineWidth = 2;

        ctx.beginPath();
        for (let i = 0; i < ast.points.length; i++) {
          const pt = ast.points[i];
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Inner crater detail
        ctx.fillStyle = '#4a3f3a';
        ctx.beginPath();
        ctx.arc(ast.radius * 0.25, ast.radius * 0.2, Math.max(3, ast.radius * 0.25), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 4. Draw Particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 5. Draw Player Ship
      if (player.health > 0) {
        const flicker = invulnerableTimer > 0 && Math.floor(Date.now() / 80) % 2 === 0;
        if (!flicker) {
          ctx.save();
          ctx.translate(player.x + player.width / 2, player.y + player.height / 2);

          // Thruster flame
          ctx.fillStyle = Math.random() > 0.5 ? '#ff8800' : '#ffdd00';
          ctx.beginPath();
          ctx.moveTo(-7, player.height / 2 - 6);
          ctx.lineTo(0, player.height / 2 + 10 + Math.random() * 6);
          ctx.lineTo(7, player.height / 2 - 6);
          ctx.closePath();
          ctx.fill();

          // Main Hull
          ctx.fillStyle = '#1e88e5';
          ctx.strokeStyle = '#64b5f6';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, -player.height / 2);
          ctx.lineTo(player.width / 2, player.height / 2);
          ctx.lineTo(0, player.height / 2 - 8);
          ctx.lineTo(-player.width / 2, player.height / 2);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Cockpit canopy
          ctx.fillStyle = '#00ffff';
          ctx.beginPath();
          ctx.ellipse(0, -4, 4, 10, 0, 0, Math.PI * 2);
          ctx.fill();

          // Wing cannons
          ctx.fillStyle = '#90caf9';
          ctx.fillRect(-player.width / 2 + 1, player.height / 2 - 12, 3, 8);
          ctx.fillRect(player.width / 2 - 4, player.height / 2 - 12, 3, 8);

          ctx.restore();
        }
      }

      // 6. HUD Bar
      ctx.fillStyle = 'rgba(10, 16, 26, 0.7)';
      ctx.fillRect(0, 0, canvas.width, 42);
      ctx.strokeStyle = 'rgba(0, 180, 255, 0.3)';
      ctx.beginPath();
      ctx.moveTo(0, 42);
      ctx.lineTo(canvas.width, 42);
      ctx.stroke();

      ctx.font = 'bold 15px monospace';
      ctx.fillStyle = '#80d8ff';
      ctx.fillText(`SCORE: ${score}`, 20, 26);
      ctx.fillText(`TARGET: ${asteroidsDestroyed}/${WIN_KILLS}`, 200, 26);

      const timeLeft = Math.max(0, Math.ceil(WIN_TIME - elapsedTime));
      const mins = Math.floor(timeLeft / 60);
      const secs = (timeLeft % 60).toString().padStart(2, '0');
      ctx.fillText(`TIME: ${mins}:${secs}`, 410, 26);

      // Lives indicator
      ctx.fillText(`LIVES:`, 600, 26);
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i < player.health ? '#ff3d00' : '#455a64';
        ctx.beginPath();
        const hx = 675 + i * 22;
        const hy = 20;
        ctx.arc(hx, hy, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      // 7. Overlay Screens
      if (window.__gameState.status === 'won') {
        ctx.fillStyle = 'rgba(0, 10, 25, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = 'center';
        ctx.font = 'bold 44px sans-serif';
        ctx.fillStyle = '#00e676';
        ctx.fillText('MISSION COMPLETE!', canvas.width / 2, canvas.height / 2 - 40);

        ctx.font = '20px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Final Score: ${score}  |  Asteroids: ${asteroidsDestroyed}`, canvas.width / 2, canvas.height / 2 + 10);

        ctx.fillStyle = '#80d8ff';
        ctx.fillText('Press [R] or [Enter] to Play Again', canvas.width / 2, canvas.height / 2 + 60);
        ctx.textAlign = 'left';
      } else if (window.__gameState.status === 'lost') {
        ctx.fillStyle = 'rgba(25, 0, 5, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = 'center';
        ctx.font = 'bold 44px sans-serif';
        ctx.fillStyle = '#ff1744';
        ctx.fillText('SHIP DESTROYED', canvas.width / 2, canvas.height / 2 - 40);

        ctx.font = '20px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Score: ${score}  |  Asteroids Destroyed: ${asteroidsDestroyed}`, canvas.width / 2, canvas.height / 2 + 10);

        ctx.fillStyle = '#ff8a80';
        ctx.fillText('Press [R] or [Enter] to Retry', canvas.width / 2, canvas.height / 2 + 60);
        ctx.textAlign = 'left';
      }
    }

    // Steady 60fps Game Loop
    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (window.__gameState && window.__gameState.status === 'playing') {
        update(dt);
      }
      render();

      requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);
  </script>

<script>
(function () {
  if (window.__gaBridge) return;
  window.__gaBridge = true;
  window.__pressed = window.__pressed || {};
  function setKey(e, on) {
    if (!e) return;
    window.__pressed[e.key] = on;
    window.__pressed[e.code] = on;
    if (e.key) window.__pressed[e.key.toLowerCase()] = on;
  }
  window.addEventListener('keydown', function (e) {
    setKey(e, true);
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  }, true);
  window.addEventListener('keyup', function (e) { setKey(e, false); }, true);
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (d.type !== 'KEY_EVENT') return;
    var fake = { key: d.key, code: d.code, keyCode: d.keyCode };
    setKey(fake, d.eventType !== 'keyup');
    try {
      var ke = new KeyboardEvent(d.eventType || 'keydown', {
        key: d.key, code: d.code, bubbles: true, cancelable: true
      });
      window.dispatchEvent(ke);
      document.dispatchEvent(ke);
    } catch (err) {}
  });
  var canvas = document.querySelector('canvas');
  if (canvas) {
    canvas.setAttribute('tabindex', '0');
    canvas.addEventListener('click', function () { canvas.focus(); });
  }
})();
</script>
</body>
</html>
