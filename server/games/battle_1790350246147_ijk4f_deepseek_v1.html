<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Showdown</title>
    <style>
        #gameCanvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;
        let lastTime = performance.now();
        let player = {
            x: 400,
            y: 300,
            width: 50,
            height: 50,
            health: 100,
            speed: 5,
            vy: 0
        };
        let score = 0;
        let status = 'playing';
        let entities = [];
        let keys = {};
        let spawnTimer = 0;

        window.__gameState = {
            player: {
                x: player.x,
                y: player.y,
                width: player.width,
                height: player.height,
                health: player.health,
                speed: player.speed
            },
            score: score,
            status: status,
            entities: entities
        };

        canvas.addEventListener('click', () => window.focus());

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') {
                player.x -= player.speed;
            } else if (e.key === 'ArrowRight' || e.key === 'd') {
                player.x += player.speed;
            } else if (e.key === 'ArrowUp' || e.key === 'w') {
                player.vy = -10;
            } else if (e.key === 'ArrowDown' || e.key === 's') {
                player.vy = 10;
            } else if (e.key === ' ') {
                player.vy = -20;
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
            if (e.key === 'ArrowUp' || e.key === 'w') {
                player.vy = 0;
            } else if (e.key === 'ArrowDown' || e.key === 's') {
                player.vy = 0;
            }
        });

        function update(dt) {
            if (status === 'playing') {
                player.y += player.vy * dt;
                player.vy += 1;
                player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
                player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

                if (keys['ArrowLeft'] || keys['a']) {
                    player.x -= player.speed * dt;
                } else if (keys['ArrowRight'] || keys['d']) {
                    player.x += player.speed * dt;
                }

                spawnTimer += dt;
                if (spawnTimer > 0.8) {
                    spawnTimer = 0;
                    if (entities.length < 30) {
                        entities.push({
                            x: Math.random() * (canvas.width - 24),
                            y: -30,
                            width: 24,
                            height: 24,
                            vy: 120 + Math.random() * 100,
                            color: '#D8125B'
                        });
                    }
                }

                for (let i = entities.length - 1; i >= 0; i--) {
                    const e = entities[i];
                    e.y += e.vy * dt;
                    if (checkAABB(player, e)) {
                        player.health -= 25;
                        entities.splice(i, 1);
                        if (player.health <= 0) {
                            status = 'lost';
                        }
                    } else if (e.y > canvas.height + 50) {
                        entities.splice(i, 1);
                    }
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (status === 'playing') {
                ctx.fillStyle = 'black';
                ctx.fillRect(player.x, player.y, player.width, player.height);
                for (const e of entities) {
                    ctx.fillStyle = e.color;
                    ctx.fillRect(e.x, e.y, e.width, e.height);
                }
                ctx.font = '24px Arial';
                ctx.fillStyle = 'black';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText(`Score: ${score}`, 10, 10);
                ctx.fillText(`Health: ${player.health}`, 10, 40);
            } else if (status === 'lost') {
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = '48px Arial';
                ctx.fillStyle = 'red';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
                ctx.font = '24px Arial';
                ctx.fillStyle = 'black';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        function checkAABB(a, b) {
            return a.x < b.x + b.width &&
                a.x + a.width > b.x &&
                a.y < b.y + b.height &&
                a.y + a.height > b.y;
        }

        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            if (window.__gameState && window.__gameState.status === 'playing') {
                update(dt);
            }
            render();
            if (status === 'lost') {
                window.__gameState.status = 'lost';
                requestAnimationFrame(gameLoop);
            } else {
                window.__gameState = {
                    player: {
                        x: player.x,
                        y: player.y,
                        width: player.width,
                        height: player.height,
                        health: player.health,
                        speed: player.speed
                    },
                    score: score,
                    status: status,
                    entities: entities
                };
                if (score >= 100) {
                    status = 'won';
                }
                requestAnimationFrame(gameLoop);
            }
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
