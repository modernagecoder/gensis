<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Showdown</title>
    <style>
        body {
            margin: 0;
            background-color: #2C2E39;
            font-family: monospace;
        }
        #gameCanvas {
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const keys = {};
        let lastTime = performance.now();
        let player = {
            x: 400,
            y: 300,
            width: 32,
            height: 32,
            health: 100,
            speed: 280
        };
        let score = 0;
        let status = 'playing';
        let entities = [];
        let spawnTimer = 0;
        let hazards = [];
        let collectibles = [];
        let gameOver = false;

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        canvas.addEventListener('click', () => {
            window.focus();
        });

        function update(dt) {
            if (status === 'playing') {
                player.x += (keys['ArrowRight'] || keys['d']) ? player.speed * dt : 0;
                player.x -= (keys['ArrowLeft'] || keys['a']) ? player.speed * dt : 0;
                player.y += (keys['ArrowDown'] || keys['s']) ? player.speed * dt : 0;
                player.y -= (keys['ArrowUp'] || keys['w']) ? player.speed * dt : 0;

                player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
                player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

                spawnTimer += dt;
                if (spawnTimer > 0.8) {
                    spawnTimer = 0;
                    if (hazards.length < 30) {
                        hazards.push({
                            x: Math.random() * (canvas.width - 24),
                            y: -30,
                            width: 24,
                            height: 24,
                            vy: 120 + Math.random() * 100,
                            color: '#D8125B'
                        });
                    }
                    if (collectibles.length < 15 && Math.random() < 0.4) {
                        collectibles.push({
                            x: Math.random() * (canvas.width - 20),
                            y: -20,
                            width: 20,
                            height: 20,
                            vy: 80 + Math.random() * 60,
                            color: '#F0C020'
                        });
                    }
                }

                for (let i = hazards.length - 1; i >= 0; i--) {
                    const h = hazards[i];
                    h.y += h.vy * dt;
                    if (checkAABB(player, h)) {
                        player.health -= 25;
                        hazards.splice(i, 1);
                        if (player.health <= 0) {
                            status = 'lost';
                            gameOver = true;
                        }
                    } else if (h.y > canvas.height + 50) {
                        hazards.splice(i, 1);
                    }
                }

                for (let i = collectibles.length - 1; i >= 0; i--) {
                    const c = collectibles[i];
                    c.y += c.vy * dt;
                    if (checkAABB(player, c)) {
                        score++;
                        collectibles.splice(i, 1);
                        if (score >= 100) {
                            status = 'won';
                            gameOver = true;
                        }
                    } else if (c.y > canvas.height + 50) {
                        collectibles.splice(i, 1);
                    }
                }

                if (gameOver) {
                    if (status === 'lost') {
                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#D8125B';
                        ctx.font = 'bold 36px monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                        ctx.font = '18px monospace';
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillText('Press SPACE or CLICK to Restart', canvas.width / 2, canvas.height / 2 + 25);
                    } else if (status === 'won') {
                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#F0C020';
                        ctx.font = 'bold 36px monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText('YOU WON!', canvas.width / 2, canvas.height / 2 - 20);
                        ctx.font = '18px monospace';
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillText('Press SPACE or CLICK to Restart', canvas.width / 2, canvas.height / 2 + 25);
                    }
                }
            }
        }

        function render() {
            ctx.fillStyle = '#2C2E39';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 20px monospace';
            ctx.fillText('SCORE: ' + score, 20, 35);
            ctx.fillText('HEALTH: ' + Math.max(0, Math.round(player.health)), 20, 65);
            if (gameOver) {
                return;
            }
            ctx.fillStyle = '#D8125B';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            for (let h of hazards) {
                ctx.fillStyle = h.color;
                ctx.fillRect(h.x, h.y, h.width, h.height);
            }
            for (let c of collectibles) {
                ctx.fillStyle = c.color;
                ctx.fillRect(c.x, c.y, c.width, c.height);
            }
            syncGameState();
        }

        function checkAABB(a, b) {
            return a.x < b.x + b.width &&
                a.x + a.width > b.x &&
                a.y < b.y + b.height &&
                a.y + a.height > b.y;
        }

        function syncGameState() {
            window.__gameState = {
                player: {
                    x: player.x,
                    y: player.y,
                    width: player.width,
                    height: player.height,
                    health: player.health,
                    speed: player.speed
                },
                score: score,
                status: status,
                entities: entities
            };
        }
