<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Eating Apple</title>
    <style>
        #gameCanvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        let canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');
        let player = {
            x: 400,
            y: 300,
            width: 20,
            height: 20,
            health: 100,
            speed: 5
        };
        let score = 0;
        let status = 'playing';
        let entities = [
            {
                type: 'apple',
                x: Math.floor(Math.random() * (canvas.width - 20)) + 10,
                y: Math.floor(Math.random() * (canvas.height - 20)) + 10,
                width: 20,
                height: 20
            }
        ];
        let walls = [
            {
                x: 0,
                y: 0,
                width: canvas.width,
                height: 20
            },
            {
                x: 0,
                y: canvas.height - 20,
                width: canvas.width,
                height: 20
            },
            {
                x: 0,
                y: 20,
                width: 20,
                height: canvas.height - 40
            },
            {
                x: canvas.width - 20,
                y: 20,
                width: 20,
                height: canvas.height - 40
            }
        ];
        let playerBoundary = {
            x: 0,
            y: 0,
            width: canvas.width,
            height: canvas.height
        };
        let snakeBody = [
            {
                x: player.x,
                y: player.y
            }
        ];
        let gameOver = false;
        let gameOverScreen = {
            x: canvas.width / 2 - 100,
            y: canvas.height / 2 - 50,
            width: 200,
            height: 100,
            message: ''
        };
        window.__gameState = {
            player,
            score,
            status,
            entities,
            walls,
            snakeBody,
            gameOver,
            gameOverScreen
        };

        function update() {
            if (!gameOver) {
                window.__gameState.score++;
                window.__gameState.entities = [
                    {
                        type: 'apple',
                        x: Math.floor(Math.random() * (canvas.width - 20)) + 10,
                        y: Math.floor(Math.random() * (canvas.height - 20)) + 10,
                        width: 20,
                        height: 20
                    }
                ];
                window.__gameState.snakeBody.push({
                    x: player.x,
                    y: player.y
                });
                if (player.x < 0 || player.x > canvas.width - player.width || player.y < 0 || player.y > canvas.height - player.height) {
                    gameOver = true;
                    window.__gameState.gameOver = true;
                    window.__gameState.gameOverScreen.message = 'Game Over! You hit the wall.';
                }
                for (let i = 0; i < window.__gameState.snakeBody.length - 1; i++) {
                    if (player.x === window.__gameState.snakeBody[i].x && player.y === window.__gameState.snakeBody[i].y) {
                        gameOver = true;
                        window.__gameState.gameOver = true;
                        window.__gameState.gameOverScreen.message = 'Game Over! You hit your own body.';
                        break;
                    }
                }
                if (player.x + player.width > window.__gameState.entities[0].x && player.x < window.__gameState.entities[0].x + window.__gameState.entities[0].width && player.y + player.height > window.__gameState.entities[0].y && player.y < window.__gameState.entities[0].y + window.__gameState.entities[0].height) {
                    score++;
                    window.__gameState.score = score;
                    window.__gameState.entities = [];
                    window.__gameState.snakeBody.pop();
                }
                if (score >= 10) {
                    gameOver = true;
                    window.__gameState.gameOver = true;
                    window.__gameState.gameOverScreen.message = 'You Won!';
                }
            }
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < walls.length; i++) {
                ctx.fillStyle = 'gray';
                ctx.fillRect(walls[i].x, walls[i].y, walls[i].width, walls[i].height);
            }
            ctx.fillStyle = 'green';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = 'red';
            ctx.fillRect(window.__gameState.entities[0].x, window.__gameState.entities[0].y, window.__gameState.entities[0].width, window.__gameState.entities[0].height);
            ctx.fillStyle = 'black';
            ctx.font = '24px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Score: ' + window.__gameState.score, 10, 10);
            ctx.fillText('Health: ' + window.__gameState.player.health, 10, 40);
            if (gameOver) {
                ctx.fillStyle = 'black';
                ctx.font = '48px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(window.__gameState.gameOverScreen.message, window.__gameState.gameOverScreen.x + window.__gameState.gameOverScreen.width / 2, window.__gameState.gameOverScreen.y + window.__gameState.gameOverScreen.height / 2);
            }
        }

        function handleInput(event) {
            if (event.key === 'ArrowLeft' || event.key === 'A') {
                if (player.x > 0) {
                    player.x -= player.speed;
                    snakeBody.push({
                        x: player.x,
                        y: player.y
                    });
                }
            } else if (event.key === 'ArrowRight' || event.key === 'D') {
                if (player.x < canvas.width - player.width) {
                    player.x += player.speed;
                    snakeBody.push({
                        x: player.x,
                        y: player.y
                    });
                }
            } else if (event.key === 'ArrowUp' || event.key === 'W') {
                if (player.y > 0) {
                    player.y -= player.speed;
                    snakeBody.push({
                        x: player.x,
                        y: player.y
                    });
                }
            } else if (event.key === 'ArrowDown' || event.key === 'S') {
                if (player.y < canvas.height - player.height) {
                    player.y += player.speed;
                    snakeBody.push({
                        x: player.x,
                        y: player.y
                    });
                }
            }
        }

        document.addEventListener('keydown', handleInput);
        update();
        draw();
    </script>
</body>
</html>
