<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Cyber Samurai Slash</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial,Helvetica,sans-serif}canvas{display:block;margin:auto;background:#222}</style></head><body><canvas id="gameCanvas"></canvas><script>
const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');canvas.width=800;canvas.height=600;
const keys={};window.addEventListener('keydown',e=>keys[e.key]=true);window.addEventListener('keyup',e=>keys[e.key]=false);
canvas.addEventListener('click',()=>window.focus());
let lastTime=performance.now(),status='playing',score=0,combo=0,spawnTimer=0,fireCooldown=0;
const player={x:380,y:520,width:40,height:40,health:100,speed:200,dy:0,dashTime:0};
const drones=[],shurikens=[],powerups=[];
function rect(a,b){return a.x<b.x+a.width&&a.x+a.width>b.x&&a.y<b.y+a.height&&a.y+a.height>b.y;}
function update(dt){if(status!=='playing')return;player.dashTime=max(0,player.dashTime-dt);
if(keys.ArrowUp)player.y-=player.speed*dt;if(keys.ArrowDown)player.y+=player.speed*dt;
if(keys.ArrowLeft)player.x-=player.speed*dt;if(keys.ArrowRight)player.x+=player.speed*dt;
if(keys.Shift&&player.dashTime===0){player.dashTime=0.3;player.speed=400;}
if(keys.Space&&fireCooldown<=0){fireCooldown=0.18;bullets.push({x:player.x+player.width/2-3,y:player.y-12,width:6,height:12,vy:-400,color:'#D8125B'});}
fireCooldown=max(0,fireCooldown-dt);
player.x=Math.max(0,Math.min(canvas.width-player.width,player.x));
player.y=Math.max(0,Math.min(canvas.height-player.height,player.y));
spawnTimer+=dt;if(spawnTimer>0.8){spawnTimer=0;if(drones.length<20)drones.push({x:Math.random()*(canvas.width-30),y:-30,width:30,height:30,vy:80+Math.random()*40,color:'#0F0'});}
for(let i=drones.length-1;i>=0;i--){const d=drones[i];d.y+=d.vy*dt;if(rect(player,d)){player.health-=20;drones.splice(i,1);combo=0;if(player.health<=0)status='lost';}else if(d.y>canvas.height+50)drones.splice(i,1);}
for(let i=shurikens.length-1;i>=0;i--){const s=shurikens[i];s.y+=s.vy*dt;if(rect(player,s)){status='lost';shurikens.splice(i,1);}else if(s.y>canvas.height+50)shurikens.splice(i,1);}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y+=b.vy*dt;if(b.y<-20)bullets.splice(i,1);else for(let j=drones.length-1;j>=0;j--){const d=drones[j];if(rect(b,d)){bullets.splice(i,1);drones.splice(j,1);score+=100*(combo+1);combo++;break;}}}
if(combo>0&&combo%5===0)score+=200; if(score>=10000&&drones.length===0)status='won';
}
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#FFF';ctx.fillRect(player.x,player.y,player.width,player.height);
drones.forEach(d=>{ctx.fillStyle=d.color;ctx.fillRect(d.x,d.y,d.width,d.height);});
shurikens.forEach(s=>{ctx.fillStyle=s.color;ctx.fillRect(s.x,s.y,s.width,s.height);});
bullets.forEach(b=>{ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.width,b.height);});
ctx.fillStyle='#FFF';ctx.font='20px Arial';ctx.fillText('Health:'+player.health,10,30);ctx.fillText('Score:'+score,10,60);ctx.fillText('Combo:'+combo,10,90);
if(status!=='playing'){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#FFF';ctx.font='40px Arial';ctx.textAlign='center';ctx.fillText(status==='won'?'YOU WON!':'GAME OVER',canvas.width/2,canvas.height/2-20);ctx.font='20px Arial';ctx.fillText('Click to restart',canvas.width/2,canvas.height/2+20);}
}
function gameLoop(now){const dt=Math.min((now-lastTime)/1000,0.1);lastTime=now;update(dt);render();requestAnimationFrame(gameLoop);}
window.__gameState={player:{x:player.x,y:player.y,width:player.width,height:player.height,health:player.health,speed:player.speed},score:score,status:status,entities:{drones,shurikens,bullets}};
requestAnimationFrame(gameLoop);
</script></body></html>
