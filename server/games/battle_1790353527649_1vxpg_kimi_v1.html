<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Showdown</title>
    <style>
        body {
            margin: 0;
            background-color: #2C2E39;
        }
        #gameCanvas {
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const keys = {};

        let lastTime = performance.now();
        let player = {
            x: 400,
            y: 300,
            width: 32,
            height: 32,
            health: 100,
            speed: 280
        };
        let score = 0;
        let status = 'playing';
        let entities = [];
        let spawnTimer = 0;

        window.__gameState = {
            player: {
                x: player.x,
                y: player.y,
                width: player.width,
                height: player.height,
                health: player.health,
                speed: player.speed
            },
            score: score,
            status: status,
            entities: entities
        };

        canvas.addEventListener('click', () => window.focus());

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        function update(dt) {
            if (keys['ArrowLeft'] || keys['a']) {
                player.x -= player.speed * dt;
            }
            if (keys['ArrowRight'] || keys['d']) {
                player.x += player.speed * dt;
            }
            if (keys['ArrowUp'] || keys['w']) {
                player.y -= player.speed * dt;
            }
            if (keys['ArrowDown'] || keys['s']) {
                player.y += player.speed * dt;
            }

            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            spawnTimer += dt;
            if (spawnTimer > 0.8) {
                spawnTimer = 0;
                if (entities.length < 30) {
                    entities.push({
                        x: Math.random() * (canvas.width - 24),
                        y: -30,
                        width: 24,
                        height: 24,
                        vy: 120 + Math.random() * 100,
                        color: '#D8125B'
                    });
                }
                if (Math.random() < 0.4 && entities.length < 15) {
                    entities.push({
                        x: Math.random() * (canvas.width - 20),
                        y: -20,
                        width: 20,
                        height: 20,
                        vy: 80 + Math.random() * 60,
                        color: '#F0C020'
                    });
                }
            }

            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                e.y += e.vy * dt;
                if (checkAABB(player, e)) {
                    player.health -= 25;
                    entities.splice(i, 1);
                    if (player.health <= 0) {
                        status = 'lost';
                    }
                } else if (e.y > canvas.height + 50) {
                    entities.splice(i, 1);
                }
            }

            syncGameState();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.width, e.height);
            }
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#F0C020';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 20px monospace';
            ctx.fillText('SCORE: ' + score, 20, 35);
            ctx.fillText('HEALTH: ' + Math.max(0, Math.round(player.health)), 20, 65);
            if (status === 'lost') {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#D8125B';
                ctx.font = 'bold 36px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '18px monospace';
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText('Press SPACE or CLICK to Restart', canvas.width / 2, canvas.height / 2 + 25);
            }
            renderHUD(ctx);
        }

        function renderHUD(ctx) {
            ctx.fillStyle = '#2C2E39';
            ctx.font = 'bold 20px monospace';
            ctx.fillText('SCORE: ' + score, 20, 35);
            ctx.fillText('HEALTH: ' + Math.max(0, Math.round(player.health)), 20, 65);
        }

        function checkAABB(a, b) {
            return !(a.x + a.width < b.x || a.x > b.x + b.width || a.y + a.height < b.y || a.y > b.y + b.height);
        }

        function syncGameState() {
            window.__gameState.player.x = player.x;
            window.__gameState.player.y = player.y;
            window.__gameState.player.health = player.health;
            window.__gameState.score = score;
            window.__gameState.status = status;
            window.__gameState.entities = entities;
        }

        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;
            if (window.__gameState && window.__gameState.status === 'playing') {
                update(dt);
            }
            render();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
